{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- =========================
ESTILOS
========================= -->
<style>

:root{
    --bg:#f4f7f6;
    --card:#ffffff;
    --primary:#187f4a;
    --secondary:#2563eb;
    --danger:#dc2626;
    --warning:#f59e0b;
    --border:#dcdcdc;
    --text:#222;
    --shadow:0 5px 15px rgba(0,0,0,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    font-family:'Poppins',sans-serif;
    color:var(--text);
}

/* =========================
NAVBAR
========================= */

.navbar{
    width:100%;
    background:#1f2937;
    display:flex;
    justify-content:center;
    gap:15px;
    padding:15px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:var(--shadow);
}

.nav-btn{
    border:none;
    background:transparent;
    color:white;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:.25s;
}

.nav-btn:hover{
    background:rgba(255,255,255,.1);
}

.nav-btn.active{
    background:var(--primary);
}

/* =========================
SECCIONES
========================= */

.view-section{
    display:none;
    max-width:1600px;
    margin:auto;
    padding:20px;
}

.view-section.active{
    display:block;
}

/* =========================
CONFIG PANEL
========================= */

.config-panel{
    background:var(--card);
    padding:20px;
    border-radius:16px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
}

.config-panel input,
.config-panel select{
    padding:10px;
    border:1px solid var(--border);
    border-radius:8px;
    min-width:180px;
}

/* =========================
BOTONES
========================= */

.btn{
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-danger{
    background:var(--danger);
    color:white;
}

.btn-secondary{
    background:var(--secondary);
    color:white;
}

/* =========================
TABLAS
========================= */

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:var(--shadow);
}

th{
    background:var(--primary);
    color:white;
    padding:12px;
    font-size:.9rem;
}

td{
    border:1px solid var(--border);
    height:90px;
    vertical-align:top;
    padding:5px;
}

.hora-col{
    width:90px;
    background:#eef2ff;
    font-weight:bold;
    text-align:center;
    vertical-align:middle;
}

/* =========================
CELDAS
========================= */

.cell{
    width:100%;
    height:100%;
    cursor:pointer;
    transition:.2s;
}

.cell:hover{
    background:#f0fdf4;
}

.card-horario{
    border-left:5px solid var(--primary);
    background:#ecfdf5;
    border-radius:8px;
    padding:5px;
    margin-bottom:4px;
    font-size:.75rem;
    text-align:left;
}

.card-relevo{
    background:#fff7ed;
    border-left-color:#ea580c;
}

.card-horario strong{
    display:block;
}

/* =========================
PANEL
========================= */

.controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    background:white;
    padding:15px;
    border-radius:15px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
}

.controls input{
    padding:10px;
    border:1px solid var(--border);
    border-radius:8px;
}

.row-link{
    cursor:pointer;
    transition:.2s;
}

.row-link:hover{
    background:#f0fdf4;
}

/* =========================
MODAL
========================= */

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:999;
}

.modal{
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:350px;
    background:white;
    border-radius:16px;
    padding:25px;
    z-index:1000;
    box-shadow:var(--shadow);
}

.modal h3{
    margin-bottom:15px;
}

.modal-body{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.modal input,
.modal select{
    padding:10px;
    border:1px solid var(--border);
    border-radius:8px;
}

/* =========================
CALENDARIO
========================= */

.calendar-controls{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.calendar-controls button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:var(--secondary);
    color:white;
}

.calendar-box{
    background:white;
    padding:15px;
    border-radius:15px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
}

.sync{
    font-size:.8rem;
    color:#10b981;
    font-weight:bold;
}

</style>

<!-- =========================
NAVBAR
========================= -->

<nav class="navbar">

    <button 
        class="nav-btn active"
        id="btn-asignar"
        onclick="cambiarVista('asignar')"
    >
        ✏️ Asignación
    </button>

    <button 
        class="nav-btn"
        id="btn-panel"
        onclick="cambiarVista('panel')"
    >
        📊 Panel
    </button>

</nav>

<!-- =========================
VISTA ASIGNAR
========================= -->

<section 
    id="vista-asignar"
    class="view-section active"
>

    <!-- CALENDARIO -->

    <div class="calendar-box">

        <div class="calendar-controls">

            <button onclick="cambiarSemana(-1)">
                ⬅ Semana
            </button>

            <h2 id="tituloSemana">
                Semana Actual
            </h2>

            <button onclick="cambiarSemana(1)">
                Semana ➡
            </button>

        </div>

    </div>

    <!-- PANEL CONFIG -->

    <div class="config-panel">

        <strong>Profesor:</strong>

        <input 
            type="text"
            id="nombreProfesor"
            placeholder="Nombre del profesor"
        >

        <select id="tipoBloque">

            <option value="clase">
                📚 Clase
            </option>

            <option value="relevo">
                🔄 Relevo
            </option>

        </select>

        <button 
            class="btn btn-primary"
            onclick="guardarHorario()"
        >
            💾 Guardar Horario
        </button>

        <button 
            class="btn btn-danger"
            onclick="limpiarTemporal()"
        >
            🗑 Limpiar
        </button>

    </div>

    <!-- TABLA -->

    <table>

        <thead>

            <tr>

                <th class="hora-col">
                    Hora
                </th>

                <th>Lunes</th>
                <th>Martes</th>
                <th>Miércoles</th>
                <th>Jueves</th>
                <th>Viernes</th>
                <th>Sábado</th>

            </tr>

        </thead>

        <tbody id="gridAsignar">

        </tbody>

    </table>

</section>

<!-- =========================
VISTA PANEL
========================= -->

<section 
    id="vista-panel"
    class="view-section"
>

    <div class="controls">

        <div style="display:flex; gap:10px;">

            <button 
                class="btn btn-primary"
                onclick="cambiarModoLista('profesores')"
            >
                Profesores
            </button>

            <button 
                class="btn btn-secondary"
                onclick="cambiarModoLista('cursos')"
            >
                Cursos
            </button>

        </div>

        <input 
            type="text"
            id="searchBar"
            placeholder="Buscar..."
            oninput="renderizarLista()"
        >

        <div class="sync">
            ● Sincronizado
        </div>

    </div>

    <h2 
        id="panelTitle"
        style="margin-bottom:15px;"
    >
        Panel General
    </h2>

    <table>

        <thead id="headPanel">

        </thead>

        <tbody id="bodyPanel">

        </tbody>

    </table>

</section>

<!-- =========================
OVERLAY
========================= -->

<div 
    class="overlay"
    id="overlay"
    onclick="cerrarModal()"
></div>

<!-- =========================
MODAL
========================= -->

<div 
    class="modal"
    id="modal"
>

    <h3 id="modalTitle">
        Nuevo Bloque
    </h3>

    <div class="modal-body">

        <input 
            type="text"
            id="m_materia"
            placeholder="Materia"
        >

        <input 
            type="text"
            id="m_curso"
            placeholder="Curso"
        >

        <input 
            type="text"
            id="m_salon"
            placeholder="Salón"
        >

        <button 
            class="btn btn-primary"
            onclick="confirmarCelda()"
        >
            Guardar
        </button>

        <button 
            class="btn btn-danger"
            onclick="eliminarCelda()"
        >
            Eliminar
        </button>

    </div>

</div>

{% endblock %}
