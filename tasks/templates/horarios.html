{% extends 'base.html' %}
{% load static %}

{% block content %}

<link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
>

<style>

:root{
    --bg:#f3f4f6;
    --card:#ffffff;
    --primary:#15803d;
    --secondary:#2563eb;
    --danger:#dc2626;
    --warning:#ea580c;
    --border:#d1d5db;
    --text:#111827;
    --shadow:0 8px 25px rgba(0,0,0,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    font-family:'Poppins',sans-serif;
}

/* =====================================
NAVBAR
===================================== */

.navbar{
    width:100%;
    background:#111827;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    box-shadow:var(--shadow);
}

.navbar h1{
    color:white;
    font-size:1.4rem;
}

.nav-right{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
}

/* =====================================
BOTONES
===================================== */

.btn{
    border:none;
    padding:12px 18px;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-secondary{
    background:var(--secondary);
    color:white;
}

.btn-danger{
    background:var(--danger);
    color:white;
}

/* =====================================
CONTENEDOR
===================================== */

.container{
    max-width:1850px;
    margin:auto;
    padding:25px;
}

/* =====================================
PANELES
===================================== */

.panel{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:var(--shadow);
}

/* =====================================
CONFIGURACIÓN
===================================== */

.config-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));

    gap:15px;
}

.config-grid input,
.config-grid select{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid var(--border);
    outline:none;
    font-size:.95rem;
}

/* =====================================
SEMANA
===================================== */

.calendar-controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.calendar-controls h2{
    font-size:1.1rem;
}

/* =====================================
HORARIO ACTUAL
===================================== */

.current-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

.current-info strong{
    color:var(--primary);
}

/* =====================================
TABLA
===================================== */

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1400px;
    border-collapse:collapse;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:var(--shadow);
}

th{
    background:var(--primary);
    color:white;
    padding:15px;
    font-size:.95rem;
}

td{
    border:1px solid #e5e7eb;
    height:140px;
    min-width:200px;
    vertical-align:top;
    padding:5px;
}

.hora-col{
    width:120px;
    text-align:center;
    vertical-align:middle;
    background:#eff6ff;
    font-weight:700;
}

/* =====================================
CELDAS
===================================== */

.cell{
    width:100%;
    height:100%;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
}

.cell:hover{
    background:#f0fdf4;
}

/* =====================================
CARDS
===================================== */

.card-horario{
    background:#ecfdf5;
    border-left:6px solid var(--primary);
    border-radius:12px;
    padding:10px;
    margin-bottom:5px;
    font-size:.8rem;
    line-height:1.5;
}

.card-horario strong{
    display:block;
    margin-bottom:5px;
}

.card-relevo{
    background:#fff7ed;
    border-left-color:var(--warning);
}

/* =====================================
MODAL
===================================== */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    z-index:999;
}

.modal{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:420px;
    max-width:95%;
    background:white;
    border-radius:20px;
    padding:25px;
    display:none;
    z-index:1000;
    box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.modal h2{
    margin-bottom:15px;
}

.modal-body{
    display:flex;
    flex-direction:column;
    gap:12px;
}

/* =====================================
RESPONSIVE
===================================== */

@media(max-width:900px){

    .navbar{
        justify-content:center;
    }

    .current-info{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>

<!-- =====================================
NAVBAR
===================================== -->

<nav class="navbar">

    <h1>
        📚 Gestión de Horarios
    </h1>

    <div class="nav-right">

        <button
            class="btn btn-secondary"
            onclick="limpiarTodo()"
        >
            🗑 Limpiar Todo
        </button>

    </div>

</nav>

<!-- =====================================
CONTENEDOR
===================================== -->

<div class="container">

    <!-- CONFIG -->

    <div class="panel">

        <div class="config-grid">

            <!-- CATEGORÍA -->

            <select id="categoriaCurso">

                <option value="">
                    Seleccionar categoría
                </option>

                <option value="Seniors">
                    Seniors
                </option>

                <option value="Teens">
                    Teens
                </option>

                <option value="Masters">
                    Masters
                </option>

            </select>

            <!-- GRADO -->

            <input
                type="text"
                id="gradoInput"
                placeholder="Ejemplo: 3A"
            >

            <!-- BOTÓN -->

            <button
                class="btn btn-primary"
                onclick="cargarHorario()"
            >
                📂 Cargar Horario
            </button>

        </div>

    </div>

    <!-- SEMANA -->

    <div class="panel">

        <div class="calendar-controls">

            <button
                class="btn btn-secondary"

            >
                ⬅ Semana
            </button>

            <h2 id="tituloSemana">

            <button

            >

        </div>

    </div>

    <!-- HORARIO ACTUAL -->

    <div class="panel">

        <div class="current-info">

            <div>

                📂 Horario Actual:

                <strong id="nombreHorarioActual">
                    Sin horario cargado
                </strong>

            </div>

            <div>

                ✅ Los cambios se guardan automáticamente

            </div>

        </div>

    </div>

    <!-- CONFIG BLOQUES -->

    <div class="panel">

        <div class="config-grid">

            <!-- PROFESOR -->

            <select id="profesorSelect">

                <option value="">
                    Seleccionar profesor
                </option>

            </select>

            <!-- MATERIA -->

            <input
                type="text"
                id="materiaInput"
                placeholder="Materia"
            >

            <!-- SALÓN -->

            <input
                type="text"
                id="salonInput"
                placeholder="Salón"
            >

            <!-- TIPO -->

            <select id="tipoBloque">

                <option value="clase">
                    📚 Clase
                </option>

                <option value="relevo">
                    🔄 Relevo
                </option>

            </select>

        </div>

    </div>

    <!-- TABLA -->

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th class="hora-col">
                        Hora
                    </th>

                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>

                </tr>

            </thead>

            <tbody id="gridAsignar">

            </tbody>

        </table>

    </div>

</div>

<!-- =====================================
OVERLAY
===================================== -->

<div
    class="overlay"
    id="overlay"
    onclick="cerrarModal()"
></div>

<!-- =====================================
MODAL
===================================== -->

<div
    class="modal"
    id="modal"
>

    <h2>
        Gestión del Bloque
    </h2>

    <div class="modal-body">

        <button
            class="btn btn-primary"
            onclick="guardarBloque()"
        >
            💾 Guardar Bloque
        </button>

        <button
            class="btn btn-danger"
            onclick="eliminarBloque()"
        >
            🗑 Eliminar Bloque
        </button>

    </div>

</div>

<!-- =====================================
JS
===================================== -->

<script>
    /* =========================================
CONFIGURACIÓN
========================================= */

const dias = [
    "Lunes",
    "Martes",
    "Miércoles",
    "Jueves",
    "Viernes"
];

const horas = [
    "06:00 - 07:00",
    "07:00 - 08:00",
    "08:00 - 09:00",
    "09:00 - 10:00",
    "10:00 - 11:00",
    "11:00 - 12:00",
    "12:00 - 13:00",
    "13:00 - 14:00",
    "14:00 - 15:00",
    "15:00 - 16:00"
];

/* =========================================
USUARIOS REGISTRADOS
DESPUÉS ESTO VENDRÁ DE DJANGO
========================================= */

const usuariosRegistrados = [

    {
        nombre: "Salamanca",
        tipo: "Seniors"
    },

    {
        nombre: "Carlos",
        tipo: "Teens"
    },

    {
        nombre: "Andrea",
        tipo: "Masters"
    },

    {
        nombre: "Fernanda",
        tipo: "Seniors"
    },

    {
        nombre: "Mateo",
        tipo: "Teens"
    }

];

/* =========================================
VARIABLES
========================================= */

let horarios = JSON.parse(
    localStorage.getItem("horariosGrados")
) || {};

let horarioActual = null;

let gradoActual = null;

let categoriaActual = null;

let celdaActual = null;

let fechaActual = new Date();

/* =========================================
INICIO
========================================= */

document.addEventListener("DOMContentLoaded", () => {

    crearGrid();

    cargarProfesores();

    actualizarSemana();

});

/* =========================================
CREAR GRID
========================================= */

function crearGrid(){

    const tbody = document.getElementById(
        "gridAsignar"
    );

    tbody.innerHTML = "";

    horas.forEach((hora, fila) => {

        const tr =
            document.createElement("tr");

        let html = `
            <td class="hora-col">
                ${hora}
            </td>
        `;

        dias.forEach((dia, col) => {

            html += `
                <td>

                    <div
                        class="cell"
                        id="cell-${fila}-${col}"
                        onclick="
                            abrirModal(
                                ${fila},
                                ${col}
                            )
                        "
                    ></div>

                </td>
            `;

        });

        tr.innerHTML = html;

        tbody.appendChild(tr);

    });

}

/* =========================================
CARGAR PROFESORES
========================================= */

function cargarProfesores(){

    const select =
    document.getElementById(
        "profesorSelect"
    );

    select.innerHTML = `
        <option value="">
            Seleccionar profesor
        </option>
    `;

    usuariosRegistrados.forEach(usuario => {

        select.innerHTML += `
            <option value="${usuario.nombre}">
                ${usuario.nombre}
                (${usuario.tipo})
            </option>
        `;

    });

}

/* =========================================
CREAR O CARGAR HORARIO
========================================= */

function cargarHorario(){

    const categoria = document
    .getElementById("categoriaCurso")
    .value;

    const grado = document
    .getElementById("gradoInput")
    .value
    .trim();

    if(grado === ""){

        alert(
            "Escribe un grado"
        );

        return;

    }

    if(categoria === ""){

        alert(
            "Selecciona categoría"
        );

        return;

    }

    categoriaActual = categoria;

    gradoActual = grado;

    const clave =
        `${categoria}-${grado}`;

    /* =====================================
    EXISTE
    ===================================== */

    if(horarios[clave]){

        horarioActual =
            horarios[clave];

    }

    /* =====================================
    NUEVO
    ===================================== */

    else{

        horarioActual = {

            categoria,
            grado,

            bloques: [],

            excepciones: []

        };

        horarios[clave] =
            horarioActual;

        guardarSistema();

    }

    document.getElementById(
        "nombreHorarioActual"
    ).innerText = `
        ${categoria} - ${grado}
    `;

    renderizarHorario();

}

/* =========================================
GUARDAR
========================================= */

function guardarSistema(){

    localStorage.setItem(
        "horariosGrados",
        JSON.stringify(horarios)
    );

}

/* =========================================
SEMANA
========================================= */

function obtenerLunes(fecha){

    const copia = new Date(fecha);

    const dia = copia.getDay();

    const diferencia =
        dia === 0 ? -6 : 1 - dia;

    copia.setDate(
        copia.getDate() + diferencia
    );

    return copia;

}

function actualizarSemana(){

    const lunes =
        obtenerLunes(fechaActual);

    const viernes =
        new Date(lunes);

    viernes.setDate(
        viernes.getDate() + 4
    );

    const opciones = {

        day:'numeric',

        month:'long'

    };

    document.getElementById(
        "tituloSemana"
    ).innerText = `
        ${lunes.toLocaleDateString(
            'es-CO',
            opciones
        )}

        -

        ${viernes.toLocaleDateString(
            'es-CO',
            opciones
        )}
    `;

}

function cambiarSemana(valor){

    fechaActual.setDate(
        fechaActual.getDate() + (7 * valor)
    );

    actualizarSemana();

    renderizarHorario();

}

/* =========================================
MODAL
========================================= */

function abrirModal(fila, col){

    if(!horarioActual){

        alert(
            "Primero carga un horario"
        );

        return;

    }

    celdaActual = {
        fila,
        col
    };

    document.getElementById(
        "overlay"
    ).style.display = "block";

    document.getElementById(
        "modal"
    ).style.display = "block";

}

function cerrarModal(){

    document.getElementById(
        "overlay"
    ).style.display = "none";

    document.getElementById(
        "modal"
    ).style.display = "none";

}

/* =========================================
GUARDAR BLOQUE
========================================= */

function guardarBloque(){

    if(!horarioActual) return;

    const profesor = document
    .getElementById(
        "profesorSelect"
    )
    .value;

    const materia = document
    .getElementById(
        "materiaInput"
    )
    .value
    .trim();

    const salon = document
    .getElementById(
        "salonInput"
    )
    .value
    .trim();

    const tipo = document
    .getElementById(
        "tipoBloque"
    )
    .value;

    if(
        !profesor ||
        !materia ||
        !salon
    ){

        alert(
            "Completa todos los campos"
        );

        return;

    }

    /* =====================================
    RELEVO
    ===================================== */

    if(tipo === "relevo"){

        horarioActual.excepciones.push({

            fecha:
                obtenerFechaCelda(),

            fila:
                celdaActual.fila,

            col:
                celdaActual.col,

            profesor,
            materia,
            salon,
            tipo

        });

    }

    /* =====================================
    CLASE NORMAL
    ===================================== */

    else{

        horarioActual.bloques =
        horarioActual.bloques.filter(b => {

            return !(
                b.fila === celdaActual.fila &&
                b.col === celdaActual.col
            );

        });

        horarioActual.bloques.push({

            fila:
                celdaActual.fila,

            col:
                celdaActual.col,

            profesor,
            materia,
            salon,
            tipo

        });

    }

    guardarSistema();

    renderizarHorario();

    cerrarModal();

}

/* =========================================
RENDER
========================================= */

function renderizarHorario(){

    document.querySelectorAll(".cell")
    .forEach(cell => {

        cell.innerHTML = "";

    });

    if(!horarioActual) return;

    horarioActual.bloques.forEach(bloque => {

        const cell = document.getElementById(
            `cell-${bloque.fila}-${bloque.col}`
        );

        if(!cell) return;

        const excepcion =
        horarioActual.excepciones.find(e => {

            return (

                e.fecha ===
                obtenerFechaRender(
                    bloque.col
                )

                &&

                e.fila === bloque.fila

                &&

                e.col === bloque.col

            );

        });

        /* =================================
        RELEVO
        ================================= */

        if(excepcion){

            cell.innerHTML = `

                <div class="
                    card-horario
                    card-relevo
                ">

                    <strong>
                        🔄 RELEVO
                    </strong>

                    👨‍🏫
                    ${excepcion.profesor}
                    <br>

                    📚
                    ${excepcion.materia}
                    <br>

                    🏫
                    ${excepcion.salon}

                </div>

            `;

        }

        /* =================================
        NORMAL
        ================================= */

        else{

            cell.innerHTML = `

                <div class="card-horario">

                    <strong>
                        ${bloque.materia}
                    </strong>

                    👨‍🏫
                    ${bloque.profesor}
                    <br>

                    🏫
                    ${bloque.salon}

                </div>

            `;

        }

    });

}

/* =========================================
FECHA
========================================= */

function obtenerFechaCelda(){

    const lunes =
        obtenerLunes(fechaActual);

    const fecha =
        new Date(lunes);

    fecha.setDate(
        fecha.getDate() +
        celdaActual.col
    );

    return fecha
    .toISOString()
    .split("T")[0];

}

function obtenerFechaRender(col){

    const lunes =
        obtenerLunes(fechaActual);

    const fecha =
        new Date(lunes);

    fecha.setDate(
        fecha.getDate() + col
    );

    return fecha
    .toISOString()
    .split("T")[0];

}

/* =========================================
ELIMINAR
========================================= */

function eliminarBloque(){

    if(!horarioActual) return;

    horarioActual.bloques =
    horarioActual.bloques.filter(b => {

        return !(

            b.fila ===
            celdaActual.fila

            &&

            b.col ===
            celdaActual.col

        );

    });

    guardarSistema();

    renderizarHorario();

    cerrarModal();

}

/* =========================================
LIMPIAR
========================================= */

function limpiarTodo(){

    if(!confirm(
        "¿Seguro?"
    )) return;

    localStorage.removeItem(
        "horariosGrados"
    );

    horarios = {};

    horarioActual = null;

    renderizarHorario();

    document.getElementById(
        "nombreHorarioActual"
    ).innerText =
    "Sin horario cargado";

}

/* =========================================
MIS SUSCRIPCIONES.HTML
========================================= */

</script>
