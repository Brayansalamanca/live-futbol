{% extends 'base.html' %}
{% load static %}

{% block content %}

<link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
>
<link rel="stylesheet" href="{% static 'css/horarios.css' %}">

<div class="container">

    <!-- TOP -->

    <div class="topbar">

        <h1>
            📚 Gestión de Horarios
        </h1>

        <button
            class="btn btn-danger"
            onclick="limpiarTodo()"
        >
            🗑 Limpiar Todo
        </button>

    </div>

    <!-- BUSQUEDAS -->

    <div class="panel">

        <div class="search-grid">

            <!-- PROFESORES -->

            <div>

                <h3 style="margin-bottom:10px;">
                    🔍 Buscar Profesor
                </h3>

                <div class="search-box">

                    <input
                        type="text"
                        id="busquedaHorario"
                        placeholder="Profesor, materia o salón..."
                        oninput="buscarHorarioInteligente()"
                        autocomplete="off"
                    >

                    <div
                        class="sugerencias"
                        id="sugerenciasBusqueda"
                    ></div>

                </div>

                <button
                    class="btn btn-primary"
                    style="margin-top:10px;"
                    onclick="verProfesorActual()"
                >
                    📍 ¿Dónde está ahora?
                </button>

            </div>

            <!-- CURSOS -->

            <div>

                <h3 style="margin-bottom:10px;">
                    📚 Buscar Curso Completo
                </h3>

                <div class="search-box">

                    <input
                        type="text"
                        id="busquedaCurso"
                        placeholder="Ej: 6A"
                        oninput="buscarCurso()"
                        autocomplete="off"
                    >

                    <div
                        class="sugerencias"
                        id="sugerenciasCurso"
                    ></div>

                </div>

                <div class="curso-actions">

                    <button
                        class="btn btn-secondary"
                        onclick="buscarCursoManual()"
                    >
                        🔎 Buscar
                    </button>

                    <button
                        class="btn btn-danger"
                        onclick="eliminarHorarioCurso()"
                    >
                        🗑 Eliminar
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- INFO -->

    <div class="panel">

        <div class="info-actual">

            <div class="info-box">

                📂 Mostrando:

                <strong id="nombreHorarioActual">
                    Ningún horario seleccionado
                </strong>

            </div>

            <div class="semana-control">

    <button
        class="btn btn-secondary semana-btn"
        onclick="cambiarSemana(-1)"
    >
        ⬅
    </button>

    <div id="tituloSemana">
        Semana
    </div>

    <button
        class="btn btn-secondary semana-btn"
        onclick="cambiarSemana(1)"
    >
        ➡
    </button>

</div>

        </div>

    </div>

    <!-- CONFIG -->

    <div class="panel">

        <div class="config-grid">

            <select id="categoriaCurso">

                <option value="">
                    Categoría
                </option>

                <option value="Seniors">
                    Seniors
                </option>

                <option value="Teens">
                    Teens
                </option>

                <option value="Masters">
                    Masters
                </option>

            </select>

            <input
                type="text"
                id="gradoInput"
                placeholder="Curso"
            >

            <select id="profesorSelect">

                <option value="">
                    Profesor
                </option>

            </select>

            <input
                type="text"
                id="materiaInput"
                placeholder="Materia"
            >

            <input
                type="text"
                id="salonInput"
                placeholder="Salón"
            >

            <select id="tipoBloque">

                <option value="clase">
                    📚 Clase
                </option>

                <option value="relevo">
                    🔄 Relevo
                </option>

                <option value="descanso">
                    ☕ Descanso
                </option>

            </select>

        </div>

    </div>

    <!-- TABLA -->

    <div class="panel table-wrapper">

        <table>

            <thead>

                <tr>

                    <th class="hora-col">
                        Hora
                    </th>

                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                    <th>Sábado</th>
                    <th>Domingo</th>

                </tr>

            </thead>

            <tbody id="gridAsignar">

            </tbody>

        </table>

    </div>

</div>

<!-- MODAL -->

<div
    class="overlay"
    id="overlay"
    onclick="cerrarModal()"
></div>

<div
    class="modal"
    id="modal"
>

    <h2 style="margin-bottom:15px;">
        Gestión del Bloque
    </h2>

    <div class="modal-body">

        <button
            class="btn btn-primary"
            onclick="guardarBloque()"
        >
            💾 Guardar Bloque
        </button>

        <button
            class="btn btn-danger"
            onclick="eliminarBloque()"
        >
            🗑 Eliminar Bloque
        </button>

        <button
            class="btn btn-danger"
            onclick="eliminarHorarioProfesor()"
        >
            🗑 Eliminar Horario Profesor
        </button>

    </div>

</div>
<script src="{% static 'js/horarios.js' %}" >

</script>

{% endblock %}
