{% extends 'base.html' %}
{% load static %}

{% block content %}

<link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
>

<link
    rel="stylesheet"
    href="{% static 'css/horarios.css' %}"
>

<div class="container">

    <!-- ====================================================== -->
    <!-- TOPBAR -->
    <!-- ====================================================== -->

    <div class="topbar">

        <h1>

            📚 Gestión de Horarios

        </h1>

        <button
            class="btn btn-danger"
            onclick="limpiarTodo()"
        >

            🗑 Limpiar Todo

        </button>

    </div>

    <!-- ====================================================== -->
    <!-- BUSCADORES -->
    <!-- ====================================================== -->

    <div class="panel">

        <div class="search-grid">

            <!-- =============================================== -->
            <!-- BUSCAR PROFESOR -->
            <!-- =============================================== -->

            <div>

                <h3>

                    🔍 Buscar Profesor

                </h3>

                <div class="search-box">

                    <input
                        id="busquedaHorario"
                        type="text"
                        placeholder="Profesor, materia o salón..."
                        autocomplete="off"
                        oninput="buscarHorarioInteligente()"
                    >

                    <div
                        class="sugerencias"
                        id="sugerenciasBusqueda"
                    >

                    </div>

                </div>

                <button
                    class="btn btn-primary"
                    onclick="verProfesorActual()"
                >

                    📍 ¿Dónde está ahora?

                </button>

            </div>

            <!-- =============================================== -->
            <!-- BUSCAR CURSO -->
            <!-- =============================================== -->

            <div>

                <h3>

                    📚 Buscar Curso

                </h3>

                <div class="search-box">

                    <input
                        id="busquedaCurso"
                        type="text"
                        placeholder="Ej: Seniors 1A"
                        autocomplete="off"
                        oninput="buscarCurso()"
                    >

                    <div
                        class="sugerencias"
                        id="sugerenciasCurso"
                    >

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- ====================================================== -->
    <!-- INFORMACIÓN DEL HORARIO -->
    <!-- ====================================================== -->

    <div class="panel">

        <div class="info-actual">

            <div class="info-box">

                📂 Mostrando:

                <strong id="nombreHorarioActual">

                    Ningún horario seleccionado

                </strong>

            </div>

            <div class="semana-control">

                <button
                    class="btn btn-secondary semana-btn"
                    onclick="cambiarSemana(-1)"
                >

                    ⬅

                </button>

                <div id="tituloSemana">

                    Semana

                </div>

                <button
                    class="btn btn-secondary semana-btn"
                    onclick="cambiarSemana(1)"
                >

                    ➡

                </button>

            </div>

        </div>

    </div>

    <!-- ====================================================== -->
    <!-- CONFIGURACIÓN -->
    <!-- ====================================================== -->

    <div class="panel">

        <div class="config-grid">

            <select id="categoriaCurso">

                <option value="">

                    Categoría

                </option>

                <option value="Seniors">

                    Seniors

                </option>

                <option value="Teens">

                    Teens

                </option>

                <option value="Masters">

                    Masters

                </option>

            </select>

            <input
                id="gradoInput"
                type="text"
                placeholder="Curso"
            >

            <select id="profesorSelect">

                <option value="">

                    Profesor

                </option>

            </select>

            <input
                id="materiaInput"
                type="text"
                placeholder="Materia"
            >

            <input
                id="salonInput"
                type="text"
                placeholder="Salón"
            >

            <select id="tipoBloque">

                <option value="clase">

                    📚 Clase

                </option>

                <option value="relevo">

                    🔄 Relevo

                </option>

                <option value="descanso">

                    ☕ Descanso

                </option>

            </select>

        </div>

    </div>
        <!-- ====================================================== -->
    <!-- TABLA DE HORARIOS -->
    <!-- ====================================================== -->

    <div class="panel table-wrapper">

        <table class="tabla-horario">

            <thead>

                <tr>

                    <th class="hora-col">

                        Hora

                    </th>

                    <th>

                        Lunes

                    </th>

                    <th>

                        Martes

                    </th>

                    <th>

                        Miércoles

                    </th>

                    <th>

                        Jueves

                    </th>

                    <th>

                        Viernes

                    </th>

                    <th>

                        Sábado

                    </th>

                    <th>

                        Domingo

                    </th>

                </tr>

            </thead>

            <!--
                El contenido del horario se crea automáticamente
                desde crearGrid() del archivo horarios.js
            -->

            <tbody id="gridAsignar">

            </tbody>

        </table>

    </div>

</div>

<!-- ====================================================== -->
<!-- OVERLAY -->
<!-- ====================================================== -->

<div
    id="overlay"
    class="overlay"
    onclick="cerrarModal()"
>

</div>

<!-- ====================================================== -->
<!-- MODAL -->
<!-- ====================================================== -->

<div
    id="modal"
    class="modal"
>

    <h2>

        Gestión del Bloque

    </h2>

    <div class="modal-body">

        <button
            class="btn btn-primary"
            onclick="guardarBloque()"
        >

            💾 Guardar Bloque

        </button>

        <button
            class="btn btn-danger"
            onclick="eliminarBloque()"
        >

            🗑 Eliminar Bloque

        </button>

    </div>

</div>
<!-- ====================================================== -->
<!-- JAVASCRIPT -->
<!-- ====================================================== -->

<script
    src="{% static 'js/horarios.js' %}"
></script>

{% endblock %}
