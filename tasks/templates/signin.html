{% extends "base.html" %}

{% block content %}
<style>
.form-container {
    max-width: 400px;
    margin: auto;
    padding: 2rem;
    border-radius: 10px;
    box-shadow: 2px 5px 45px; /* Dejamos la sombra para marcar la forma */
  }

  .form-container h1 {
    text-align: center;
    margin-bottom: 1rem;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 1rem;
  }

  .form-group label {
    margin-bottom: 0.3rem;
    font-weight: bold;
    font-size: 0.9rem;
  }

  .form-group input {
    padding: 0.5rem;
    border-radius: 5px;
    border: none; /* Como el original */
    outline: none;
  }

  .form-container button {
    padding: 0.7rem;
    border: none; /* Como el original */
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    transition: opacity 0.3s;
    width: 100%;
    margin-top: 0.5rem;
  }

  .form-container button:hover {
    opacity: 0.8;
  }

  .secondary-btn {
    margin-top: 0.5rem;
  }

  .link-btn {
    margin-top: 0.5rem;
  }
</style>

<div class="form-container">
  <h1>Iniciar sesión</h1>

  {% if error %}
    <p style="color: red; text-align: center;">{{ error }}</p>
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <div class="form-group">
      {{ form.username.label_tag }}
      {{ form.username }}
    </div>

    <div class="form-group">
      {{ form.password.label_tag }}
      {{ form.password }}
    </div>

    <button type="submit">Ingresar</button>
  </form>

  <div style="margin-top: 1rem; text-align: center;">
    <a href="{% url 'password_reset' %}">
      <button type="button" class="link-btn">¿Olvidaste tu contraseña?</button>
    </a>
  </div>

</div>
{% endblock %}
