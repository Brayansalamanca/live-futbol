{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="seccion-bajas">
    <div class="contenedor-bajas">

        <div class="card-header-bajas">
            <h1>🚨 Reporte de <span class="accent-text">Bajas Deportivas</span></h1>
        </div>

        <div class="card card-formulario">
            <form id="formBalones">
                <div class="grid-inputs">
                    <div class="input-group">
                        <label>QUIEN ALQUILÓ</label>
                        <input type="text" id="alquilado_por" placeholder="Nombre de quien alquiló" class="input-hibrido">
                    </div>
                    <div class="input-group">
                        <label class="label-danger">QUIEN LO BOTÓ / DAÑÓ</label>
                        <input type="text" id="usuario" placeholder="Nombre del responsable" class="input-hibrido">
                    </div>
                    <div class="input-group">
                        <label>MATERIAL</label>
                        <select id="tipo" class="input-hibrido">
                            <option>Fútbol</option>
                            <option>Futsal</option>
                            <option>Voleibol</option>
                            <option>Baloncesto</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>EVIDENCIA</label>
                        <input type="file" id="imagen_file" accept="image/*" class="file-input">
                    </div>
                </div>

                <div class="grid-inputs row-extra">
                    <input type="text" id="lugar" placeholder="📍 Lugar del incidente" class="input-hibrido">
                    <select id="causa" class="input-hibrido">
                        <option value="Perdido">Perdido</option>
                        <option value="Pinchado">Pinchado</option>
                        <option value="Robo">Robo</option>
                    </select>
                </div>

                <button type="button" onclick="guardarBaja()" id="btnGuardar" class="btn-enviar">
                    🚀 Registrar Novedad
                </button>
            </form>
        </div>

        <div class="card card-tabla">
            <div class="tabla-header">
                <h2>Historial de Bajas</h2>
                <button onclick="exportarExcel()" class="btn-excel">
                    📥 DESCARGAR EXCEL
                </button>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>FOTO</th>
                            <th>FECHA</th>
                            <th>RESPONSABLES</th> 
                            <th>MATERIAL / LUGAR</th>
                            <th>ESTADO</th>
                            <th>ACCIÓN</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="visor_inv" onclick="this.style.display='none'" class="visor-modal">
    <img id="img_visor_inv" class="visor-img">
</div>


<link rel="stylesheet" href="{% static 'css/balones_perdidos.css' %}">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const CONFIG = {
    urlObtener: "{% url 'api_obtener_bajas' %}",
    urlGuardar: "{% url 'api_guardar_baja' %}",
    csrf: "{{ csrf_token }}"
};

console.log("CONFIG =", CONFIG);
</script>
<script src="{% static 'js/balones_perdidos.js' %}"></script>


{% endblock %}
