{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="min-height: 100vh; padding-top: 6rem; padding-bottom: 50px; font-family: 'Inter', sans-serif;">
    <div style="max-width: 1200px; margin: 0 auto; padding: 0 20px;">

        <div style="background: linear-gradient(90deg, #004080, #001a33); border-radius: 20px 20px 0 0; padding: 25px; border-bottom: 3px solid #00ccff;">
            <h1 style="margin: 0; font-size: 26px; text-transform: uppercase; font-weight: 900;">
                🚨 Reporte de <span style="color: #00ccff;">Bajas Deportivas</span>
            </h1>
        </div>

        <div style="background-color: rgba(0, 43, 92, 0.5); backdrop-filter: blur(10px); border-radius: 0 0 20px 20px; padding: 30px; margin-bottom: 40px; border: 1px solid rgba(0,204,255,0.1);">
            <form id="formBalones">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;">
                    <div>
                        <label style="display: block; margin-bottom: 8px; font-size: 11px; font-weight: bold; color: #00ccff;">QUIEN ALQUILÓ</label>
                        <input type="text" id="alquilado_por" placeholder="Nombre de quien alquiló" style="width: 100%; height: 45px; background: #001122; border: 1px solid #0059b3; border-radius: 8px; color: white; padding: 0 15px; outline: none;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 8px; font-size: 11px; font-weight: bold; color: #ff4444;">QUIEN LO BOTÓ / DAÑÓ</label>
                        <input type="text" id="usuario" placeholder="Nombre del responsable" style="width: 100%; height: 45px; background: #001122; border: 1px solid #0059b3; border-radius: 8px; color: white; padding: 0 15px; outline: none;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 8px; font-size: 11px; font-weight: bold; color: #00ccff;">MATERIAL</label>
                        <select id="tipo" style="width: 100%; height: 45px; background: #001122; border: 1px solid #0059b3; border-radius: 8px; color: white; padding: 0 10px;">
                            <option>Fútbol</option><option>Futsal</option><option>Voleibol</option><option>Baloncesto</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 8px; font-size: 11px; font-weight: bold; color: #00ccff;">EVIDENCIA</label>
                        <input type="file" id="imagen_file" accept="image/*" style="width: 100%; color: #88a0b0; font-size: 12px;">
                    </div>
                </div>
                <div style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <input type="text" id="lugar" placeholder="📍 Lugar del incidente" style="width: 100%; height: 45px; background: #001122; border: 1px solid #0059b3; border-radius: 8px; color: white; padding: 0 15px; outline: none;">
                    <select id="causa" style="width: 100%; height: 45px; background: #001122; border: 1px solid #0059b3; border-radius: 8px; color: white; padding: 0 10px;">
                        <option value="Perdido">Perdido</option><option value="Pinchado">Pinchado</option><option value="Robo">Robo</option>
                    </select>
                </div>
                <button type="button" onclick="guardarBaja()" id="btnGuardar" style="width: 100%; margin-top: 25px; background: #00ccff; color: #000d1a; border: none; height: 50px; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase;">
                    🚀 Registrar Novedad
                </button>
            </form>
        </div>

        <div style="background-color: #001a33; border: 1px solid #004080; border-radius: 15px; overflow: hidden;">
            <div style="padding: 15px; background: #002b5c; display: flex; justify-content: space-between; align-items: center;">
                <h2 style="margin:0; font-size: 14px; text-transform: uppercase;">Historial de Bajas</h2>
                <button onclick="exportarExcel()" style="background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px;">
                    📥 DESCARGAR EXCEL
                </button>
            </div>
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; color: white; text-align: center;">
                    <thead>
                        <tr style="background: #000d1a; font-size: 12px; color: #00ccff;">
                            <th style="padding: 15px;">FOTO</th>
                            <th>FECHA</th>
                            <th>RESPONSABLES</th> 
                            <th>MATERIAL / LUGAR</th>
                            <th>ESTADO</th>
                            <th>ACCIÓN</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="visor_inv" onclick="this.style.display='none'" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 99999; justify-content: center; align-items: center;">
    <img id="img_visor_inv" style="max-width: 90%; max-height: 90%; border: 2px solid #00ccff; border-radius: 10px;">
</div>

<style>
    .img-celda { width: 130px; height: 85px; object-fit: cover; border-radius: 8px; border: 2px solid #004080; cursor: pointer; }
    td { border-bottom: 1px solid #002b5c; padding: 12px; font-size: 14px; }
    button:hover { opacity: 0.8; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
let datosGlobales = [];
const IMG_DEFAULT = "{% static 'sin evidencia.webp' %}";

async function sincronizar() {
    try {
        const res = await fetch("{% url 'api_obtener_bajas' %}");
        const data = await res.json();
        datosGlobales = data;
        dibujarTabla(data);
    } catch (e) { console.error("Error al sincronizar:", e); }
}

function dibujarTabla(data) {
    const tbody = document.getElementById('tablaCuerpo');
    if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="padding:30px; color:#88a0b0;">No hay reportes registrados.</td></tr>';
        return;
    }

    tbody.innerHTML = data.map(b => {
        // Mapeo ultra-flexible para que NO salgan guiones si el server no los envía
        const responsable = b.responsable || b.usuario || 'Anónimo';
        const alquilo = b.alquilado_por || '---';
        const material = b.tipo_balon || b.tipo || '---';
        const lugar = b.lugar || 'Ubicación no especificada';
        const causa = b.causa || 'Reportado';
        const img = b.imagen || IMG_DEFAULT;
        let fecha = 'Reciente';
        if (b.fecha) {
            const date = new Date(b.fecha);
            if (!isNaN(date.getTime())) {
                fecha = date.toLocaleString();
            } else {
                // Manejo seguro si el backend devuelve un string no ISO
                const fallback = b.fecha.replace(/\//g, '-').replace(' ', 'T');
                const date2 = new Date(fallback);
                fecha = !isNaN(date2.getTime()) ? date2.toLocaleString() : b.fecha;
            }
        }

        return `
            <tr>
                <td>
                    <img src="${img}" class="img-celda" onclick="verImg('${img}')" onerror="this.src='${IMG_DEFAULT}'">
                </td>
                <td style="font-size: 11px; color:#88a0b0;">${fecha}</td>
                <td style="text-align: left;">
                    <div style="font-size: 11px; color: #00ccff;">ALQUILÓ: <span style="color: white; font-weight: bold;">${alquilo}</span></div>
                    <div style="font-size: 11px; color: #ff4444;">BOTÓ: <span style="color: white; font-weight: bold;">${responsable}</span></div>
                </td>
                <td>${material}<br><small style="color:#00ccff">${lugar}</small></td>
                <td><span style="background:#004080; padding:4px 8px; border-radius:4px; font-size:10px;">${causa.toUpperCase()}</span></td>
                <td>
                    <button onclick="eliminar('${b.id}')" style="background:none; color:#ff4444; border:1px solid #ff4444; padding:5px 10px; border-radius:4px; cursor:pointer; font-size:11px;">Eliminar</button>
                </td>
            </tr>
        `;
    }).join('');
}

async function guardarBaja() {
    const btn = document.getElementById('btnGuardar');
    const file = document.getElementById('imagen_file').files[0];
    const user = document.getElementById('usuario').value.trim();
    
    if (!user) return alert("Escribe al menos el nombre del responsable.");

    btn.disabled = true;
    btn.innerText = "⏳ REGISTRANDO...";

    const enviar = async (imgData) => {
        const payload = {
            usuario: user,
            alquilado_por: document.getElementById('alquilado_por').value,
            tipo: document.getElementById('tipo').value,
            lugar: document.getElementById('lugar').value,
            causa: document.getElementById('causa').value,
            imagen: imgData
        };

        try {
            const res = await fetch("{% url 'api_guardar_baja' %}", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}" },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                document.getElementById('formBalones').reset();
                sincronizar();
            }
        } catch (e) { alert("Error al guardar."); }
        finally {
            btn.disabled = false;
            btn.innerText = "🚀 Registrar Novedad";
        }
    };

    if (file) {
        const reader = new FileReader();
        reader.onload = (e) => enviar(e.target.result);
        reader.readAsDataURL(file);
    } else {
        enviar(null);
    }
}

function verImg(src) {
    document.getElementById('img_visor_inv').src = src;
    document.getElementById('visor_inv').style.display = 'flex';
}

async function eliminar(id) {
    if (confirm("¿Eliminar este registro?")) {
        const res = await fetch(`/api/eliminar-baja/${id}/`, { 
            method: "POST", 
            headers: { "X-CSRFToken": "{{ csrf_token }}" } 
        });
        if (res.ok) sincronizar();
    }
}

function exportarExcel() {
    if (datosGlobales.length === 0) return alert("No hay datos.");
    const ws = XLSX.utils.json_to_sheet(datosGlobales);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Bajas");
    XLSX.writeFile(wb, "Reporte_Bajas.xlsx");
}

window.onload = sincronizar;
</script>
{% endblock %}
