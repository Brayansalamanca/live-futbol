{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="seccion-bajas">
    <div class="contenedor-bajas">

        <div class="card-header-bajas">
            <h1>🚨 Reporte de <span class="accent-text">Bajas Deportivas</span></h1>
        </div>

        <div class="card card-formulario">
            <form id="formBalones">
                <div class="grid-inputs">
                    <div class="input-group">
                        <label>QUIEN ALQUILÓ</label>
                        <input type="text" id="alquilado_por" placeholder="Nombre de quien alquiló" class="input-hibrido">
                    </div>
                    <div class="input-group">
                        <label class="label-danger">QUIEN LO BOTÓ / DAÑÓ</label>
                        <input type="text" id="usuario" placeholder="Nombre del responsable" class="input-hibrido">
                    </div>
                    <div class="input-group">
                        <label>MATERIAL</label>
                        <select id="tipo" class="input-hibrido">
                            <option>Fútbol</option>
                            <option>Futsal</option>
                            <option>Voleibol</option>
                            <option>Baloncesto</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>EVIDENCIA</label>
                        <input type="file" id="imagen_file" accept="image/*" class="file-input">
                    </div>
                </div>

                <div class="grid-inputs row-extra">
                    <input type="text" id="lugar" placeholder="📍 Lugar del incidente" class="input-hibrido">
                    <select id="causa" class="input-hibrido">
                        <option value="Perdido">Perdido</option>
                        <option value="Pinchado">Pinchado</option>
                        <option value="Robo">Robo</option>
                    </select>
                </div>

                <button type="button" onclick="guardarBaja()" id="btnGuardar" class="btn-enviar">
                    🚀 Registrar Novedad
                </button>
            </form>
        </div>

        <div class="card card-tabla">
            <div class="tabla-header">
                <h2>Historial de Bajas</h2>
                <button onclick="exportarExcel()" class="btn-excel">
                    📥 DESCARGAR EXCEL
                </button>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>FOTO</th>
                            <th>FECHA</th>
                            <th>RESPONSABLES</th> 
                            <th>MATERIAL / LUGAR</th>
                            <th>ESTADO</th>
                            <th>ACCIÓN</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="visor_inv" onclick="this.style.display='none'" class="visor-modal">
    <img id="img_visor_inv" class="visor-img">
</div>

<style>
    /* Estilos basados en tu protocolo Híbrido */
    .seccion-bajas { min-height: 100vh; padding: 40px 20px; }
    .contenedor-bajas { max-width: 1100px; margin: 0 auto; }

    .card-header-bajas { 
        background: var(--nav); 
        padding: 20px; 
        border-radius: var(--radius) var(--radius) 0 0;
        border-bottom: 3px solid var(--primary);
    }
    
    .accent-text { color: var(--primary); }

    .card-formulario { 
        border-radius: 0 0 var(--radius) var(--radius); 
        padding: 40px !important; 
        margin-bottom: 30px;
        text-align: left;
    }

    .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .row-extra { margin-top: 20px; grid-template-columns: 1fr 1fr; }

    .input-group label { display: block; margin-bottom: 8px; font-size: 11px; font-weight: bold; color: var(--primary); text-transform: uppercase; }
    .label-danger { color: #ff4444 !important; }

    .input-hibrido { 
        width: 100%; height: 45px; background: var(--bg-soft); 
        border: 1px solid var(--border); border-radius: 8px; 
        color: var(--text); padding: 0 15px; outline: none; 
    }

    .file-input { color: var(--text-soft); font-size: 12px; margin-top: 10px; }

    .btn-enviar { width: 100%; margin-top: 25px; height: 50px; font-size: 1rem; }

    /* Estilos Tabla */
    .card-tabla { padding: 0 !important; overflow: hidden; }
    .tabla-header { padding: 15px 25px; background: var(--nav); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .tabla-header h2 { margin: 0; font-size: 14px; text-transform: uppercase; color: var(--text); }
    
    .table-responsive { overflow-x: auto; }
    .img-celda { width: 110px; height: 70px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; }
    
    .btn-excel { background: #10b981 !important; font-size: 11px !important; }
    .btn-eliminar { background: none !important; color: #ff4444 !important; border: 1px solid #ff4444 !important; padding: 5px 10px !important; font-size: 10px !important; }

    /* Visor */
    .visor-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; }
    .visor-img { max-width: 90%; max-height: 90%; border: 2px solid var(--primary); border-radius: 10px; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
let datosGlobales = [];
const IMG_DEFAULT = "{% static 'sin evidencia.webp' %}";

async function sincronizar() {
    try {
        const res = await fetch("{% url 'api_obtener_bajas' %}");
        const data = await res.json();
        datosGlobales = data;
        dibujarTabla(data);
    } catch (e) { console.error("Error al sincronizar:", e); }
}

function dibujarTabla(data) {
    const tbody = document.getElementById('tablaCuerpo');
    if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="padding:30px; color:var(--text-soft);">No hay reportes registrados.</td></tr>';
        return;
    }

    tbody.innerHTML = data.map(b => {
        const responsable = b.responsable || b.usuario || 'Anónimo';
        const alquilo = b.alquilado_por || '---';
        const material = b.tipo_balon || b.tipo || '---';
        const lugar = b.lugar || 'No especificada';
        const causa = b.causa || 'Reportado';
        const img = b.imagen || IMG_DEFAULT;
        
        let fechaMostrada = 'Reciente';
        if (b.fecha) {
            const date = new Date(b.fecha);
            if (!isNaN(date.getTime())) {
                fechaMostrada = date.toLocaleString('es-CO');
            } else {
                fechaMostrada = b.fecha;
            }
        }

        return `
            <tr>
                <td><img src="${img}" class="img-celda" onclick="verImg('${img}')" onerror="this.src='${IMG_DEFAULT}'"></td>
                <td style="font-size: 11px; color:var(--text-soft);">${fechaMostrada}</td>
                <td style="text-align: left;">
                    <div style="font-size: 11px; color: var(--primary);">ALQUILÓ: <span style="color: var(--text); font-weight: bold;">${alquilo}</span></div>
                    <div style="font-size: 11px; color: #ff4444;">BOTÓ: <span style="color: var(--text); font-weight: bold;">${responsable}</span></div>
                </td>
                <td style="font-size: 13px;">${material}<br><small style="color:var(--primary)">${lugar}</small></td>
                <td><span style="background:var(--bg-soft); padding:4px 8px; border-radius:4px; font-size:10px; border: 1px solid var(--border);">${causa.toUpperCase()}</span></td>
                <td>
                    <button onclick="eliminar('${b.id}')" class="btn-eliminar">Eliminar</button>
                </td>
            </tr>
        `;
    }).join('');
}

async function guardarBaja() {
    const btn = document.getElementById('btnGuardar');
    const user = document.getElementById('usuario').value.trim();
    if (!user) return alert("Escribe el nombre del responsable.");

    btn.disabled = true;
    btn.innerText = "⏳ REGISTRANDO...";

    const file = document.getElementById('imagen_file').files[0];
    const enviar = async (imgData) => {
        const payload = {
            usuario: user,
            alquilado_por: document.getElementById('alquilado_por').value,
            tipo: document.getElementById('tipo').value,
            lugar: document.getElementById('lugar').value,
            causa: document.getElementById('causa').value,
            imagen: imgData
        };

        try {
            const res = await fetch("{% url 'api_guardar_baja' %}", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}" },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                document.getElementById('formBalones').reset();
                sincronizar();
            }
        } catch (e) { alert("Error al guardar."); }
        finally {
            btn.disabled = false;
            btn.innerText = "🚀 Registrar Novedad";
        }
    };

    if (file) {
        const reader = new FileReader();
        reader.onload = (e) => enviar(e.target.result);
        reader.readAsDataURL(file);
    } else {
        enviar(null);
    }
}

async function eliminar(id) {
    if (confirm("¿Eliminar este registro?")) {
        const res = await fetch(`/api/eliminar-baja/${id}/`, { 
            method: "POST", 
            headers: { "X-CSRFToken": "{{ csrf_token }}" } 
        });
        if (res.ok) sincronizar();
    }
}

function verImg(src) {
    document.getElementById('img_visor_inv').src = src;
    document.getElementById('visor_inv').style.display = 'flex';
}

function exportarExcel() {
    if (datosGlobales.length === 0) return alert("No hay datos.");
    const ws = XLSX.utils.json_to_sheet(datosGlobales);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Bajas");
    XLSX.writeFile(wb, "Reporte_Bajas.xlsx");
}

window.onload = sincronizar;
</script>
{% endblock %}
