{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2 class="mb-4" style="color: #ffcc00; text-shadow: 2px 2px 10px rgba(0,0,0,0.5);">
        🏆 Gestión de Usuarios y Permisos
    </h2>
    
    <div class="table-responsive" style="background: rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 15px; backdrop-filter: blur(10px);">
        <table class="table table-hover" style="color: white; border-collapse: separate; border-spacing: 0 10px;">
            <thead>
                <tr style="background-color: #504783; color: white;">
                    <th>Usuario</th>
                    <th>Email</th>
                    <th>Rol Solicitado</th>
                    <th>Grupo Actual</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-usuarios">
                </tbody>
        </table>
    </div>
</div>

<script>
    async function cargarUsuarios() {
        try {
            const response = await fetch('/api/usuarios/');
            const tabla = document.getElementById('tabla-usuarios');
            tabla.innerHTML = '';

            if (!response.ok) {
                console.error('Error cargando usuarios:', response.status, response.statusText);
                tabla.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#f5c6cb;">No se pudieron cargar los usuarios. Intenta recargar.</td></tr>`;
                return;
            }

            const usuarios = await response.json();

            usuarios.forEach(u => {
                const fila = document.createElement('tr');
                fila.style.background = "rgba(0, 0, 0, 0.2)";
                
                // Estilo para el badge de estado
                const statusBadge = u.estado === 'activo' 
                    ? '<span class="badge bg-success">Activo</span>' 
                    : '<span class="badge bg-warning text-dark">Pendiente</span>';

                fila.innerHTML = `
                    <td class="align-middle">${u.nombre}</td>
                    <td class="align-middle">${u.email}</td>
                    <td class="align-middle"><b style="color: #88eafc;">${u.rol}</b></td>
                    <td class="align-middle"><i>${u.grupo_asignado}</i></td>
                    <td class="align-middle">${statusBadge}</td>
                    <td class="align-middle">
                        <button onclick="cambiarEstado(${u.id})" class="btn btn-sm ${u.estado === 'activo' ? 'btn-outline-warning' : 'btn-success'}">
                            ${u.estado === 'activo' ? 'Desactivar' : 'Aprobar'}
                        </button>
                        <button onclick="eliminarUsuario(${u.id})" class="btn btn-sm btn-danger ml-2">Eliminar</button>
                    </td>
                `;
                tabla.appendChild(fila);
            });
        } catch (error) {
            console.error("Error cargando usuarios:", error);
            const tabla = document.getElementById('tabla-usuarios');
            tabla.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#f5c6cb;">Ocurrió un error al cargar usuarios.</td></tr>`;
        }
    }

    async function cambiarEstado(id) {
        if (!confirm("¿Deseas cambiar el estado y permisos de este usuario?")) return;
        
        const response = await fetch(`/api/usuarios/estado/${id}/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
        });

        if (response.ok) {
            alert("Estado y Grupo actualizados correctamente.");
            cargarUsuarios(); // Recargar la tabla
        }
    }

    async function eliminarUsuario(id) {
        if (!confirm("¿Estás seguro de eliminar permanentemente a este usuario?")) return;

        const response = await fetch(`/api/usuarios/eliminar/${id}/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
        });

        if (response.ok) {
            alert("Usuario eliminado.");
            cargarUsuarios();
        }
    }

    // Cargar al iniciar la página
    document.addEventListener('DOMContentLoaded', cargarUsuarios);
</script>

<style>
    .btn-sm { border-radius: 8px; font-weight: bold; margin: 2px; }
    .table th { border: none; padding: 15px; }
    .table td { border: none; padding: 15px; }
    .badge { padding: 8px 12px; border-radius: 6px; }
</style>
{% endblock %}
