{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    /* Estilos para que el contenido se vea más grande y centrado */
    h1 {
        font-size: 3rem; /* Título más grande */
        text-align: center;
        margin-top: 20px;
    }

    #rankingTable {
        width: 80%; /* Tabla más ancha */
        margin: 30px auto;
        font-size: 1.5rem; /* Letra más grande para los datos */
        border-collapse: collapse;
        background-color: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        overflow: hidden;
    }

    #rankingTable th, #rankingTable td {
        padding: 20px; /* Celdas con más espacio */
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Si añades imágenes, esto las hará verse grandes y nítidas */
    .foto-jugador {
        width: 60px; 
        height: 60px;
        border-radius: 50%;
        object-fit: cover;
    }

    .center {
        text-align: center;
        margin-top: 40px;
        font-size: 1.2rem;
    }

    input {
        padding: 15px;
        font-size: 1.1rem;
        border-radius: 8px;
        border: none;
        margin: 5px;
    }

    button {
        padding: 15px 30px;
        font-size: 1.1rem;
        background-color: #5f17e4;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }
</style>

<h1>🏆 Ranking de Jugadores</h1>

<table id="rankingTable">
  <thead>
    <tr>
      <th>#</th>
      <th>Nombre</th>
      <th>Puntaje</th>
    </tr>
  </thead>
  <tbody>
    </tbody>
</table>

<div class="center">
  <h3>Actualizar Puntaje</h3>
  <input type="text" id="nombreInput" placeholder="Nombre">
  <input type="number" id="puntajeInput" placeholder="Puntaje">
  <button onclick="actualizarRanking()">Actualizar</button>
</div>

<script>
  let jugadores = [
    { nombre: "Ana", puntaje: 50 },
    { nombre: "Brayan", puntaje: 40 },
    { nombre: "Carlos", puntaje: 30 }
  ];

  function mostrarRanking() {
    const tbody = document.getElementById("rankingTable").querySelector("tbody");
    tbody.innerHTML = "";

    jugadores
      .sort((a, b) => b.puntaje - a.puntaje)
      .forEach((jugador, index) => {
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td>${index + 1}</td>
          <td><strong>${jugador.nombre}</strong></td>
          <td>${jugador.puntaje} pts</td>
        `;
        tbody.appendChild(fila);
      });
  }

  function actualizarRanking() {
    const nombre = document.getElementById("nombreInput").value.trim();
    const puntaje = parseInt(document.getElementById("puntajeInput").value);

    if (!nombre || isNaN(puntaje)) return alert("Ingresa un nombre y un puntaje válido.");

    const jugadorExistente = jugadores.find(j => j.nombre.toLowerCase() === nombre.toLowerCase());

    if (jugadorExistente) {
      jugadorExistente.puntaje = puntaje;
    } else {
      jugadores.push({ nombre, puntaje });
    }

    mostrarRanking();

    document.getElementById("nombreInput").value = "";
    document.getElementById("puntajeInput").value = "";
  }

  mostrarRanking();
</script>

{% endblock %}
