{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="background-color: #000d1a; min-height: 100vh; padding-top: 6rem; padding-bottom: 50px; font-family: 'Inter', sans-serif; color: #ffffff;">
    <div style="max-width: 1000px; margin: 0 auto; padding: 0 20px;">

        <div style="background: linear-gradient(90deg, #004080, #001a33); border-radius: 20px 20px 0 0; padding: 25px; border-bottom: 3px solid #00ff88; display: flex; align-items: center; gap: 15px;">
            <div style="background: #00ff88; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 10px #00ff88;"></div>
            <h1 style="margin: 0; font-size: 24px; text-transform: uppercase; font-weight: 900; letter-spacing: 1px;">
                Control de <span style="color: #00ff88;">Accesos y Usuarios</span>
            </h1>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0;">
            <div style="background: rgba(0, 64, 128, 0.2); border: 1px solid rgba(0, 255, 136, 0.3); padding: 20px; border-radius: 15px; text-align: center;">
                <span style="display: block; font-size: 12px; color: #00ff88; margin-bottom: 5px;">PENDIENTES</span>
                <span id="cont-pendientes" style="font-size: 28px; font-weight: bold;">0</span>
            </div>
            <div style="background: rgba(0, 64, 128, 0.2); border: 1px solid rgba(0, 204, 255, 0.3); padding: 20px; border-radius: 15px; text-align: center;">
                <span style="display: block; font-size: 12px; color: #00ccff; margin-bottom: 5px;">ACTIVOS</span>
                <span id="cont-activos" style="font-size: 28px; font-weight: bold;">0</span>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <input type="text" id="buscarUsuario" onkeyup="filtrarUsuarios()" placeholder="🔍 Buscar por nombre o correo..." 
                style="width: 100%; height: 50px; background: #001122; border: 1px solid #004080; border-radius: 10px; color: white; padding: 0 20px; outline: none; transition: border 0.3s;">
        </div>

        <div style="background-color: #001a33; border: 1px solid #004080; border-radius: 15px; overflow: hidden;">
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; color: white;">
                    <thead>
                        <tr style="background: #000d1a; font-size: 12px; color: #00ccff; text-align: left;">
                            <th style="padding: 20px;">USUARIO</th>
                            <th>ROL ACTUAL</th>
                            <th>ESTADO ACCESO</th>
                            <th style="text-align: center;">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                        </tbody>
                </table>
            </div>
        </div>

        <p style="text-align: center; color: #88a0b0; font-size: 12px; margin-top: 20px;">
            * Los cambios de acceso se aplican en tiempo real.
        </p>
    </div>
</div>

<style>
    #tablaUsuarios td { padding: 15px 20px; border-bottom: 1px solid #002b5c; font-size: 14px; }
    .btn-aprobar { background: #00ff88; color: #000d1a; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-right: 5px; }
    .btn-rechazar { background: #ff4444; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-aprobar:hover, .btn-rechazar:hover { transform: scale(1.05); opacity: 0.9; }
    .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
    .status-pendiente { background: rgba(255, 165, 0, 0.2); color: #ffa500; border: 1px solid #ffa500; }
    .status-activo { background: rgba(0, 255, 136, 0.2); color: #00ff88; border: 1px solid #00ff88; }
</style>

<script>
    // Datos de ejemplo (Esto luego lo traeremos de la API de Django)
    let usuarios = [
        { id: 1, nombre: "Brayan Salamanca", email: "brayan@mail.com", rol: "Asistente", estado: "pendiente" },
        { id: 2, nombre: "Rosita Admin", email: "rosita@mail.com", rol: "Administradora", estado: "activo" },
        { id: 3, nombre: "Juan Perez", email: "juan@mail.com", rol: "Usuario", estado: "pendiente" }
    ];

    function cargarUsuarios() {
        const tbody = document.getElementById('tablaUsuarios');
        let pendientes = 0;
        let activos = 0;

        tbody.innerHTML = usuarios.map(u => {
            if(u.estado === 'pendiente') pendientes++;
            if(u.estado === 'activo') activos++;

            return `
                <tr>
                    <td>
                        <div style="font-weight: bold;">${u.nombre}</div>
                        <div style="font-size: 11px; color: #88a0b0;">${u.email}</div>
                    </td>
                    <td><span style="color: #00ccff;">${u.rol}</span></td>
                    <td>
                        <span class="status-badge ${u.estado === 'activo' ? 'status-activo' : 'status-pendiente'}">
                            ${u.estado.toUpperCase()}
                        </span>
                    </td>
                    <td style="text-align: center;">
                        ${u.estado === 'pendiente' ? 
                            `<button class="btn-aprobar" onclick="cambiarEstado(${u.id}, 'activo')">APROBAR</button>` : 
                            `<button class="btn-rechazar" onclick="cambiarEstado(${u.id}, 'pendiente')">SUSPENDER</button>`
                        }
                    </td>
                </tr>
            `;
        }).join('');

        document.getElementById('cont-pendientes').innerText = pendientes;
        document.getElementById('cont-activos').innerText = activos;
    }

    function cambiarEstado(id, nuevoEstado) {
        const user = usuarios.find(u => u.id === id);
        if(user) {
            user.estado = nuevoEstado;
            cargarUsuarios();
        }
    }

    function filtrarUsuarios() {
        const busqueda = document.getElementById('buscarUsuario').value.toLowerCase();
        const filas = document.querySelectorAll('#tablaUsuarios tr');
        
        filas.forEach(fila => {
            const texto = fila.innerText.toLowerCase();
            fila.style.display = texto.includes(busqueda) ? '' : 'none';
        });
    }

    window.onload = cargarUsuarios;
</script>
{% endblock %}
