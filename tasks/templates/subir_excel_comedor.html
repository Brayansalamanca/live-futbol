<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Subir Balones NFC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body{
            font-family: Arial;
            background:#0f172a;
            color:white;
            margin:0;
            padding:30px;
        }

        .contenedor{
            max-width:700px;
            margin:auto;
            background:#1e293b;
            padding:30px;
            border-radius:20px;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        input,
        button{
            width:100%;
            padding:15px;
            margin-top:15px;
            border:none;
            border-radius:10px;
            font-size:16px;
        }

        input{
            background:#334155;
            color:white;
        }

        button{
            background:#22c55e;
            color:white;
            cursor:pointer;
            font-weight:bold;
        }

        button:hover{
            opacity:.8;
        }

        .resultado{
            margin-top:20px;
            background:#0f172a;
            padding:15px;
            border-radius:10px;
        }

    </style>
</head>
<body>

<div class="contenedor">

    <h1>⚽ Subir Excel Balones NFC</h1>

    <input type="file" id="excel">

    <input type="text" id="hoja" placeholder="Nombre de la hoja (opcional)">

    <button onclick="subirExcel()">
        Subir Excel
    </button>

    <div class="resultado" id="resultado">

    </div>

</div>

<script>

async function subirExcel(){

    const archivo = document.getElementById('excel').files[0]

    if(!archivo){

        alert("Selecciona un Excel")
        return
    }

    const formData = new FormData()

    formData.append(
        "excel",
        archivo
    )

    formData.append(
        "hoja",
        document.getElementById('hoja').value
    )

    const response = await fetch(
        "/api/subir-balones-excel/",
        {
            method:"POST",
            body:formData
        }
    )

    const data = await response.json()

    document.getElementById('resultado').innerHTML = `

        <h3>${data.success ? '✅ Correcto' : '❌ Error'}</h3>

        <p>
            ${data.mensaje || data.error}
        </p>

    `
}

</script>

</body>
</html>
