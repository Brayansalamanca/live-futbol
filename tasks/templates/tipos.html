{% extends 'base.html' %}
{% block content %}
<div style="padding: 100px 20px; background: #000d1a; min-height: 100vh; color: white;">
    <h1 style="text-align: center; color: #00ccff;">👕 Catálogo de Inventario</h1>
    <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
        <thead style="background: #0059b3;">
            <tr>
                <th>Imagen</th>
                <th>Prenda</th>
                <th>Disponibles</th>
                <th>Estado</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tablaCuerpo" style="text-align: center;">
            </tbody>
    </table>
</div>

<script>
    async function cargar() {
        const res = await fetch("{% url 'api_obtener_prendas' %}");
        const prendas = await res.json();
        let html = "";
        prendas.forEach(p => {
            html += `
            <tr style="border-bottom: 1px solid #333;">
                <td><img src="${p.imagen}" style="width: 60px; height: 60px; border-radius: 10px; margin: 10px;"></td>
                <td>${p.nombre}</td>
                <td style="color: #27ae60;">${p.cantidad}</td>
                <td>${p.profesor === "Disponible" ? "✅ Disponible" : "🚩 " + p.profesor}</td>
                <td><button onclick="window.location.href='#'" style="background:#ff007f; color:white; border:none; padding:5px 10px; border-radius:5px;">Apartar</button></td>
            </tr>`;
        });
        document.getElementById('tablaCuerpo').innerHTML = html || "<tr><td colspan='5'>No hay prendas registradas</td></tr>";
    }
    document.addEventListener("DOMContentLoaded", cargar);
</script>
{% endblock %}
