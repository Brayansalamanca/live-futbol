{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    .contenedor-tipos {
        padding: 100px 20px;
        background-color: #000d1a;
        min-height: 100vh;
        color: white;
    }
    table {
        width: 100%;
        background: rgba(255,255,255,0.05);
        border-collapse: collapse;
        border-radius: 15px;
        overflow: hidden;
    }
    th { background: #0059b3; color: white; padding: 15px; text-align: left; }
    td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .img-mini { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 1px solid #00ccff; }
    .input-tabla { background: #001a33; border: 1px solid #00ccff; color: white; padding: 8px; border-radius: 5px; width: 100%; }
    .btn-apartar-tabla { background: #5f17e4; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
</style>

<div class="contenedor-tipos">
    <h1 style="text-align: center; color: #00ccff;">📋 Inventario y Apartado de Prendas</h1>
    
    <table>
        <thead>
            <tr>
                <th>Imagen</th>
                <th>Nombre de la Prenda</th>
                <th>Stock</th>
                <th>Profesor</th>
                <th>Fecha de Uso</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tabla-prendas">
            </tbody>
    </table>
</div>

<script>
    async function cargarInventario() {
        const res = await fetch("{% url 'api_obtener_prendas' %}");
        const prendas = await res.json();
        let html = "";

        prendas.forEach(p => {
            html += `
            <tr>
                <td><img src="${p.imagen_url}" class="img-mini" onclick="window.open(this.src)"></td>
                <td><strong>${p.nombre}</strong></td>
                <td><span style="color: #ff007f">${p.cantidad} disponibles</span></td>
                <td>
                    <select id="profesor-${p.id}" class="input-tabla">
                        <option value="">Seleccionar...</option>
                        ${[3,4,5,6,7,8,9,10,11].map(n => `<option value="Profesor ${n}">Profesor ${n}</option>`).join('')}
                    </select>
                </td>
                <td><input type="date" id="fecha-${p.id}" class="input-tabla"></td>
                <td>
                    <button class="btn-apartar-tabla" onclick="apartarPrenda(${p.id}, '${p.nombre}')">Apartar</button>
                </td>
            </tr>`;
        });
        document.getElementById("tabla-prendas").innerHTML = html || "<tr><td colspan='6' style='text-align:center'>No hay prendas registradas.</td></tr>";
    }

    async function apartarPrenda(id, nombre) {
        const profesor = document.getElementById(`profesor-${id}`).value;
        const fechaInput = document.getElementById(`fecha-${id}`).value;

        if (!profesor || !fechaInput) return alert("Completa todos los campos");

        const fechaUso = new Date(fechaInput);
        const hoy = new Date();
        const diff = Math.ceil((fechaUso - hoy) / (1000 * 60 * 60 * 24));

        if (diff < 10) return alert("❌ Mínimo 10 días de anticipación.");

        // Aquí envías a la API de apartado
        alert(`✅ Apartado solicitado para ${nombre}.\nEntregar a: ${profesor}`);
    }

    document.addEventListener("DOMContentLoaded", cargarInventario);
</script>
{% endblock %}
