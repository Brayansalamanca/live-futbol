{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<style>
    .container-alquiler { background-color: #000d1a; min-height: 100vh; padding: 100px 20px 40px; color: white; }
    .grid-prendas { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
    
    .card-prenda {
        background: rgba(255, 255, 255, 0.03); border: 1px solid #0059b3;
        border-radius: 20px; padding: 20px; transition: 0.4s;
    }
    .card-prenda:hover { border-color: #ff007f; box-shadow: 0 0 20px rgba(255, 0, 127, 0.2); }
    
    .img-prenda { width: 100%; height: 200px; object-fit: cover; border-radius: 15px; cursor: pointer; }
    
    .badge-stock {
        background: #ff007f; padding: 5px 10px; border-radius: 5px;
        font-size: 12px; font-weight: bold; position: absolute; top: 30px; right: 30px;
    }

    .input-futbol {
        width: 100%; background: #001a33; border: 1px solid #0059b3;
        color: white; padding: 10px; border-radius: 8px; margin-top: 5px;
    }
    .btn-apartar {
        width: 100%; background: linear-gradient(45deg, #ff007f, #ff4b2b);
        color: white; border: none; padding: 12px; border-radius: 10px;
        font-weight: bold; cursor: pointer; margin-top: 15px;
    }
</style>

<div class="container-alquiler">
    <h1 style="text-align: center; color: #00ccff;">👕 APARTADO DE INDUMENTARIA</h1>

    <div class="grid-prendas" id="contenedor-prendas">
        <div class="card-prenda animate__animated animate__fadeIn">
            <span class="badge-stock">Quedan: 5</span>
            <img src="{% static 'ropa_ejemplo.jpg' %}" class="img-prenda" onclick="verGrande(this.src)">
            <h3 style="margin-top:15px;">Uniforme Titular Sub-15</h3>
            
            <form onsubmit="event.preventDefault(); procesarApartado(this);">
                {% csrf_token %}
                <input type="hidden" name="prenda_id" value="1">
                <input type="hidden" name="nombre_prenda" value="Uniforme Titular Sub-15">

                <label style="font-size: 11px; color: #00ccff;">PROFESOR:</label>
                <select name="profesor" class="input-futbol" required>
                    <option value="">-- Seleccionar --</option>
                    {% for i in "34567891011" %}
                    <option value="Profesor {{ i }}">Profesor {{ i }}</option>
                    {% endfor %}
                </select>

                <label style="font-size: 11px; color: #00ccff; display: block; margin-top: 10px;">FECHA DE USO:</label>
                <input type="date" name="fecha_uso" class="input-futbol" required>

                <button type="submit" class="btn-apartar">RESERVAR AHORA</button>
            </form>
        </div>
    </div>

    {% if request.user.username == 'rosita' %}
    <div style="margin-top: 80px; background: rgba(39, 174, 96, 0.1); padding: 30px; border-radius: 20px; border: 1px solid #27ae60;">
        <h2 style="color: #27ae60;">📜 PANEL DE PAZ Y SALVO (Rosita)</h2>
        <table style="width: 100%; color: white; margin-top: 20px; border-collapse: collapse;">
            <tr style="border-bottom: 2px solid #27ae60;">
                <th>Profesor</th>
                <th>Prenda</th>
                <th>Fecha Uso</th>
                <th>Estado Entrega</th>
                <th>Acción</th>
            </tr>
            <tbody id="tabla-paz-salvo">
                </tbody>
        </table>
    </div>
    {% endif %}
</div>

<script>
async function procesarApartado(form) {
    const fechaUso = new Date(form.fecha_uso.value);
    const hoy = new Date();
    const diffDays = Math.ceil((fechaUso - hoy) / (1000 * 60 * 60 * 24));

    if (diffDays < 10) {
        alert("❌ ERROR: Debes apartar con 10 días de anticipación.");
        return;
    }

    const confirmacion = confirm(`¿Confirmas el apartado de ${form.nombre_prenda.value}?\n\nRecuerda: Devolución obligatoria al día siguiente.`);
    
    if (confirmacion) {
        const formData = new FormData(form);
        const res = await fetch("{% url 'api_apartar_prenda' %}", {
            method: "POST",
            body: formData,
            headers: { "X-CSRFToken": "{{ csrf_token }}" }
        });
        if (res.ok) {
            alert("✅ Apartado exitoso. Rosita ha sido notificada.");
            location.reload();
        }
    }
}

// Rosita decide quién entregó bien
async function darPazYSalvo(id) {
    const detalles = prompt("¿En qué estado entrega la prenda? (Ej: Limpio y completo)");
    if (detalles) {
        // Llamada a API para borrar de pendientes y actualizar stock
        alert("✅ Paz y Salvo concedido. Prenda devuelta al inventario.");
    }
}
</script>
{% endblock %}
