{% extends 'base.html' %}
{% load static %}
{% block content %}
<style>
    /* Estilos de Live Futbol */
    .container-alquiler { background-color: #000d1a; min-height: 100vh; padding: 30px; color: white; }
    .card-prenda {
        background: rgba(255, 255, 255, 0.03); border: 1px solid #0059b3; border-radius: 20px;
        padding: 20px; transition: 0.4s; position: relative; overflow: hidden;
    }
    .card-prenda:hover { border-color: #ff007f; box-shadow: 0 0 20px rgba(255, 0, 127, 0.2); }
    .card-prenda img { width: 100%; height: 200px; object-fit: cover; border-radius: 15px; cursor: zoom-in; }
    
    /* Modal Imagen Gigante */
    .modal-img {
        display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9); justify-content: center; align-items: center; cursor: zoom-out;
    }
    .modal-img img { max-width: 90%; max-height: 90%; border: 2px solid #00ccff; border-radius: 10px; }

    /* Inputs y Botones */
    .input-futbol { width: 100%; background: #001a33; border: 1px solid #0059b3; color: white; padding: 10px; border-radius: 8px; margin-top: 5px; }
    .btn-apartar { width: 100%; background: #ff007f; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; }
</style>

<div class="container-alquiler">
    <h1 style="text-align: center; color: #00ccff; text-transform: uppercase;">👕 Apartado de Indumentaria</h1>
    
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-top: 40px;">
        
        <div class="card-prenda">
            <img src="{% static 'prenda_ejemplo.webp' %}" onclick="verGrande(this.src)">
            <h3 style="color: #ff007f; margin: 15px 0 5px 0;">Uniforme Titular Sub-15</h3>
            <p style="color: #88a0b0; font-size: 13px;">Estado: <span style="color: #27ae60;">Disponible</span></p>

            <form onsubmit="event.preventDefault(); procesarApartado(this);">
                <label style="font-size: 11px; color: #00ccff;">SELECCIONE PROFESOR:</label>
                <select name="profesor" class="input-futbol" required>
                    <option value="">-- Seleccionar --</option>
                    <option value="Profesor 3">Profesor 3</option>
                    <option value="Profesor 4">Profesor 4</option>
                    <option value="Profesor 5">Profesor 5</option>
                    <option value="Profesor 6">Profesor 6</option>
                    <option value="Profesor 7">Profesor 7</option>
                    <option value="Profesor 8">Profesor 8</option>
                    <option value="Profesor 9">Profesor 9</option>
                    <option value="Profesor 10">Profesor 10</option>
                    <option value="Profesor 11">Profesor 11</option>
                </select>

                <label style="font-size: 11px; color: #00ccff; display: block; margin-top: 10px;">FECHA DE USO:</label>
                <input type="date" name="fecha_uso" class="input-futbol" required id="fecha_uso_input">

                <button type="submit" class="btn-apartar">APARTAR PRENDA</button>
            </form>
        </div>

    </div>

    <div style="margin-top: 50px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 30px;">
        <h2 style="color: #ff7675; text-transform: uppercase;">🚩 Pendientes por Devolución</h2>
        <div style="background: rgba(255, 118, 117, 0.1); padding: 20px; border-radius: 15px; border: 1px solid #ff7675;">
            <ul id="lista-pendientes" style="list-style: none; padding: 0;">
                <li style="padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
                    <strong style="color: #ff7675;">Profesor 5:</strong> Tiene "Peto Naranja" (Debió devolver ayer)
                </li>
            </ul>
        </div>
    </div>
</div>

<div id="imageModal" class="modal-img" onclick="this.style.display='none'">
    <img id="imgFull" src="">
</div>

<script>
    function verGrande(src) {
        document.getElementById('imgFull').src = src;
        document.getElementById('imageModal').style.display = 'flex';
    }

    function procesarApartado(form) {
        const fechaUso = new Date(form.fecha_uso.value);
        const hoy = new Date();
        const diffDays = Math.ceil((fechaUso - hoy) / (1000 * 60 * 60 * 24));

        if (diffDays < 10) {
            alert("❌ ERROR: Debes apartar la prenda con al menos 10 días de anticipación.");
            return;
        }

        const confirmacion = confirm(
            `CONFIRMACIÓN DE APARTADO:\n` +
            `- Profesor: ${form.profesor.value}\n` +
            `- Fecha: ${form.fecha_uso.value}\n\n` +
            `⚠️ NOTA IMPORTANTE: Si la prenda no se devuelve al día siguiente del uso, el sistema notificará automáticamente a la coordinación.`
        );

        if (confirmacion) {
            alert("✅ Apartado registrado. Rosita ha sido notificada.");
            // Aquí llamarías a tu API de guardar-apartado
        }
    }
</script>
{% endblock %}
