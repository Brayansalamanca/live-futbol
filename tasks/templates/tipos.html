{% extends 'base.html' %}
{% block content %}
<div style="padding: 100px 20px; background: #000d1a; min-height: 100vh; color: white; font-family: 'Inter', sans-serif;">
    
    <h1 style="text-align: center; color: #00ccff; text-transform: uppercase; font-weight: 900;">👕 Catálogo de Inventario</h1>
    
    <div style="overflow-x: auto; background: rgba(0, 43, 92, 0.3); border-radius: 15px; border: 1px solid #0059b3; margin-top: 20px;">
        <table style="width: 100%; border-collapse: collapse;">
            <thead style="background: #0059b3; color: white; text-transform: uppercase; font-size: 13px;">
                <tr>
                    <th style="padding: 15px;">Imagen</th>
                    <th>Prenda</th>
                    <th>Cantidad</th>
                    <th>Estado / Responsable</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tablaCuerpo" style="text-align: center;"></tbody>
        </table>
    </div>

    {% if request.user.username == 'rosita' %}
    <div style="margin-top: 60px;">
        <h2 style="color: #ffcc00; border-left: 5px solid #ffcc00; padding-left: 15px; text-transform: uppercase;">🛡️ Control de Devoluciones (Admin)</h2>
        <div style="overflow-x: auto; background: rgba(255, 204, 0, 0.05); border-radius: 15px; border: 1px solid #ffcc00; margin-top: 20px;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead style="background: #ffcc00; color: #000d1a; font-size: 13px;">
                    <tr>
                        <th style="padding: 15px;">Prenda</th>
                        <th>Quién tiene</th>
                        <th>Curso / Evento</th>
                        <th>Fecha Uso</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaDevoluciones" style="text-align: center;"></tbody>
            </table>
        </div>
    </div>
    {% endif %}
</div>

<script>
    const USUARIO_ACTUAL = "{{ request.user.username }}";

    // Función para obtener la fecha mínima (Hoy + 10 días)
    function obtenerFechaMinima() {
        const hoy = new Date();
        hoy.setDate(hoy.getDate() + 10);
        return hoy.toISOString().split('T')[0];
    }

    async function cargar() {
        try {
            const res = await fetch("{% url 'api_obtener_prendas' %}");
            const prendas = await res.json();
            
            let htmlCatalogo = "";
            let htmlDevoluciones = "";

            prendas.forEach(p => {
                const esDisponible = p.estado === "Disponible";
                
                // Lógica para la Tabla General
                htmlCatalogo += `
                <tr style="border-bottom: 1px solid rgba(0,89,179,0.2);">
                    <td><img src="${p.imagen}" style="width: 70px; height: 70px; border-radius: 10px; margin: 10px; object-fit: cover; border: 2px solid #0059b3;"></td>
                    <td style="font-weight: bold;">${p.nombre}</td>
                    <td style="color: #27ae60; font-weight: bold;">${p.cantidad}</td>
                    <td>
                        <span style="background: ${esDisponible ? '#27ae60' : '#e74c3c'}; padding: 4px 10px; border-radius: 20px; font-size: 11px;">
                            ${esDisponible ? "✅ Disponible" : "🚩 " + p.profesor}
                        </span>
                    </td>
                    <td>
                        <div style="display: flex; gap: 5px; justify-content: center;">
                            ${esDisponible 
                                ? `<button onclick="mostrarFormulario('${p.id}')" style="background:#00ccff; color:#000d1a; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer;">Apartar</button>`
                                : `<button disabled style="background:#333; color:#777; border:none; padding:8px 15px; border-radius:5px;">Ocupado</button>`
                            }
                            ${USUARIO_ACTUAL === 'rosita' ? `<button onclick="eliminarPrenda('${p.id}')" style="background:#ff4444; color:white; border:none; padding:8px 10px; border-radius:5px; cursor:pointer;">🗑️</button>` : ''}
                        </div>
                    </td>
                </tr>
                <tr id="form-${p.id}" style="display: none; background: rgba(0, 204, 255, 0.05);">
                    <td colspan="5" style="padding: 20px;">
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; align-items: end;">
                            <div>
                                <label style="font-size: 11px; color: #00ccff;">NOMBRE</label>
                                <input type="text" id="user-${p.id}" value="${USUARIO_ACTUAL}" readonly style="width:100%; background:#001a33; border:1px solid #0059b3; color:white; padding:8px; border-radius:5px;">
                            </div>
                            <div>
                                <label style="font-size: 11px; color: #00ccff;">CURSO</label>
                                <input type="text" id="curso-${p.id}" placeholder="Ej: 1101" style="width:100%; background:#001a33; border:1px solid #0059b3; color:white; padding:8px; border-radius:5px;">
                            </div>
                            <div>
                                <label style="font-size: 11px; color: #00ccff;">EVENTO</label>
                                <input type="text" id="evento-${p.id}" placeholder="Ej: Interclases" style="width:100%; background:#001a33; border:1px solid #0059b3; color:white; padding:8px; border-radius:5px;">
                            </div>
                            <div>
                                <label style="font-size: 11px; color: #00ccff;">FECHA (Mín. 10 días)</label>
                                <input type="date" id="fecha-${p.id}" min="${obtenerFechaMinima()}" style="width:100%; background:#001a33; border:1px solid #0059b3; color:white; padding:8px; border-radius:5px;">
                            </div>
                            <div style="display: flex; gap: 5px;">
                                <button onclick="confirmarApartado('${p.id}')" style="background:#27ae60; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer; flex:1;">Confirmar</button>
                                <button onclick="cerrarFormulario('${p.id}')" style="background:#e74c3c; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer;">X</button>
                            </div>
                        </div>
                    </td>
                </tr>`;

                // Lógica para la Tabla de Rosita
                if (USUARIO_ACTUAL === 'rosita' && !esDisponible) {
                    htmlDevoluciones += `
                    <tr style="border-bottom: 1px solid rgba(255,204,0,0.2);">
                        <td style="padding: 15px;">${p.nombre}</td>
                        <td style="color: #ffcc00;">${p.profesor}</td>
                        <td>${p.curso} / ${p.evento}</td>
                        <td>${p.fecha_uso}</td>
                        <td>
                            <button onclick="liberar('${p.id}')" style="background:#27ae60; color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer;">Marcar Devuelto</button>
                        </td>
                    </tr>`;
                }
            });

            document.getElementById('tablaCuerpo').innerHTML = htmlCatalogo || "<tr><td colspan='5' style='padding:20px;'>No hay prendas registradas</td></tr>";
            
            const tablaDev = document.getElementById('tablaDevoluciones');
            if(tablaDev) {
                tablaDev.innerHTML = htmlDevoluciones || "<tr><td colspan='5' style='padding:20px;'>No hay prendas pendientes de devolución</td></tr>";
            }

        } catch (e) { console.error("Error al cargar:", e); }
    }

    function mostrarFormulario(id) {
        document.getElementById(`form-${id}`).style.display = 'table-row';
    }

    function cerrarFormulario(id) {
        document.getElementById(`form-${id}`).style.display = 'none';
    }

    async function confirmarApartado(id) {
        const nombre = document.getElementById(`user-${id}`).value;
        const curso = document.getElementById(`curso-${id}`).value;
        const evento = document.getElementById(`evento-${id}`).value;
        const fecha = document.getElementById(`fecha-${id}`).value;

        if (!curso || !evento || !fecha) {
            alert("Por favor completa todos los campos.");
            return;
        }

        const res = await fetch(`/api/apartar-prenda/${id}/`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}" },
            body: JSON.stringify({ nombre, curso, evento, fecha, accion: 'apartar' })
        });

        if (res.ok) cargar();
        else alert("Error al apartar");
    }

    async function eliminarPrenda(id) {
        if (!confirm("¿Rosita, estás segura de eliminar esta prenda permanentemente?")) return;
        const res = await fetch(`/api/eliminar-prenda/${id}/`, {
            method: "POST",
            headers: { "X-CSRFToken": "{{ csrf_token }}" }
        });
        if (res.ok) cargar();
    }

    async function liberar(id) {
        if (!confirm("¿Confirmar que la prenda ha sido devuelta?")) return;
        const res = await fetch(`/api/apartar-prenda/${id}/`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}" },
            body: JSON.stringify({ accion: 'liberar' })
        });
        if (res.ok) cargar();
    }

    document.addEventListener("DOMContentLoaded", cargar);
</script>
{% endblock %}
