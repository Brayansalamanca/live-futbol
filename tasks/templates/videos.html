{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    .contenedor-registro {
        max-width: 95%;
        margin: 20px auto;
        padding: 20px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        backdrop-filter: blur(5px);
        color: white;
        padding-top: 80px;
    }

    .btn-objeto, .btn-curso {
        padding: 10px 18px; margin: 5px; border: 2px solid transparent;
        border-radius: 10px; background: #ffffff; color: #0c0c0c;
        font-weight: bold; cursor: pointer; transition: all 0.3s ease;
    }

    .btn-objeto.activo, .btn-curso.activo {
        background: #5f17e4; color: white; border-color: #ffffff;
    }

    input, select {
        width: 100%; max-width: 400px; padding: 12px; margin: 10px 0;
        border-radius: 10px; border: 2px solid #5dade2; outline: none;
    }

    /* Tabla Formal */
    .tabla-admin {
        width: 100%; background: white; color: black; border-collapse: collapse;
        margin-top: 20px; border-radius: 10px; overflow: hidden; font-size: 14px;
    }
    .tabla-admin th { background: #2c3e50; color: white; padding: 12px; }
    .tabla-admin td { padding: 10px; border: 1px solid #ddd; text-align: center; }
    .input-edit { width: 90%; padding: 5px; border: 1px solid #5f17e4; border-radius: 4px; }
</style>

<div class="contenedor-registro">
    <h1>⚽ Registro de Entrega Profesional</h1>

    <h3>1. Selecciona el objeto</h3>
    <div id="objetosContenedor">
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'Balón Fútbol')">⚽ Fútbol</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'Balón Básquet')">🏀 Básquet</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'Balón Volley')">🏐 Volley</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'Cuerda')">🥨 Cuerda</button>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px;">
        <div>
            <h3>2. Datos de Entrega</h3>
            <input id="textoVoz" placeholder="Nombre del estudiante...">
            <input id="marcaBalon" placeholder="Marca (Golty, Molten, etc.)...">
            <select id="lugarSelect">
                <option>Cancha Sintética</option>
                <option>Cancha Externa</option>
                <option>Coliseo</option>
            </select>
        </div>
        
        <div id="seccionCurso" style="flex: 1; border: 1px solid rgba(255,255,255,0.3); padding: 15px; border-radius: 10px;">
            <h3>3. Grado y Letra</h3>
            <div id="gradosContenedor"></div>
            <div id="letrasContenedor" style="margin-top: 10px;"></div>
        </div>
    </div>
    
    <button onclick="registrarEnNube()" style="background: #5f17e4; padding: 15px 40px; color: white; border: none; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold;">
        🚀 REGISTRAR ENTREGA
    </button>

    <hr style="margin: 50px 0; opacity: 0.2;">

    <h2 style="color: #5dade2;">🛠️ Panel de Administración y Control</h2>
    <input id="buscador" placeholder="🔍 Filtrar registros..." onkeyup="dibujar()" style="max-width: 100%;">
    
    <div style="overflow-x: auto;">
        <table class="tabla-admin">
            <thead>
                <tr>
                    <th>Estudiante</th>
                    <th>Grado</th>
                    <th>Objeto</th>
                    <th>Marca</th>
                    <th>Lugar</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaCuerpo"></tbody>
        </table>
    </div>
</div>

<script>
    let registros = [];
    let objetoActual = "", gradoActual = "", letraActual = "";
    
    // LISTA DE VETADOS
    const VETADOS = ["pepito perez", "estudiante problema"];

    async function cargarDatos() {
        try {
            const res = await fetch("{% url 'api_obtener_entregas' %}");
            const data = await res.json();
            if (JSON.stringify(data) !== JSON.stringify(registros)) {
                registros = data;
                dibujar();
            }
        } catch (e) { console.error(e); }
    }

    async function registrarEnNube() {
        const nombre = document.getElementById("textoVoz").value.trim();
        const marca = document.getElementById("marcaBalon").value.trim();
        const lugar = document.getElementById("lugarSelect").value;
        const curso = gradoActual + (letraActual || "");

        if (!nombre || !objetoActual || !gradoActual) {
            alert("⚠️ Faltan datos críticos."); return;
        }

        if (VETADOS.includes(nombre.toLowerCase())) {
            alert("❌ BLOQUEADO: Estudiante vetado."); return;
        }

        const datos = {
            recibido_por: nombre,
            curso: curso,
            balon: objetoActual,
            lugar: lugar,
            marca: marca // Asegúrate que tu modelo en Django tenga este campo
        };

        const res = await fetch("{% url 'api_guardar_entrega' %}", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}" },
            body: JSON.stringify(datos)
        });

        if (res.ok) { resetearFormulario(); cargarDatos(); }
    }

    function dibujar() {
        let html = "";
        const filtro = document.getElementById("buscador").value.toLowerCase();

        registros.forEach((r, index) => {
            const txt = (r.recibido_por + r.curso + r.balon).toLowerCase();
            if (txt.includes(filtro)) {
                html += `
                <tr id="fila-${r.id}">
                    <td><input class="input-edit" id="edit-nom-${r.id}" value="${r.recibido_por || r.nombre}"></td>
                    <td><input class="input-edit" id="edit-cur-${r.id}" value="${r.curso}"></td>
                    <td><input class="input-edit" id="edit-obj-${r.id}" value="${r.balon || r.objeto}"></td>
                    <td><input class="input-edit" id="edit-mar-${r.id}" value="${r.marca || 'N/A'}"></td>
                    <td><input class="input-edit" id="edit-lug-${r.id}" value="${r.lugar}"></td>
                    <td>
                        <button onclick="guardarCambios('${r.id}')" style="background:#27ae60; color:white; border:none; padding:5px; border-radius:4px; cursor:pointer;">💾</button>
                        <button onclick="marcarEntregado('${r.id}')" style="background:#e74c3c; color:white; border:none; padding:5px; border-radius:4px; cursor:pointer;">🗑️</button>
                    </td>
                </tr>`;
            }
        });
        document.getElementById("tablaCuerpo").innerHTML = html || "<tr><td colspan='6'>Sin registros</td></tr>";
    }

    async function guardarCambios(id) {
        const datos = {
            id: id,
            recibido_por: document.getElementById(`edit-nom-${id}`).value,
            curso: document.getElementById(`edit-cur-${id}`).value,
            balon: document.getElementById(`edit-obj-${id}`).value,
            marca: document.getElementById(`edit-mar-${id}`).value,
            lugar: document.getElementById(`edit-lug-${id}`).value,
        };

        // Aquí llamarías a una nueva API que crearemos para actualizar
        const res = await fetch(`/api/actualizar-entrega/${id}/`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}" },
            body: JSON.stringify(datos)
        });

        if (res.ok) alert("✅ Registro actualizado");
    }

    // --- Funciones de Interfaz ---
    function seleccionarObjeto(btn, obj) {
        objetoActual = obj;
        document.querySelectorAll(".btn-objeto").forEach(b => b.classList.remove("activo"));
        btn.classList.add("activo");
    }

    function seleccionarGrado(btn, grado) {
        gradoActual = grado;
        document.querySelectorAll("#gradosContenedor .btn-curso").forEach(b => b.classList.remove("activo"));
        btn.classList.add("activo");
        generarLetras(grado);
    }

    function seleccionarLetra(btn, letra) {
        letraActual = letra;
        document.querySelectorAll("#letrasContenedor .btn-curso").forEach(b => b.classList.remove("activo"));
        btn.classList.add("activo");
    }

    function generarLetras(grado) {
        let letras = ['A', 'B', 'C', 'D'];
        let html = "";
        letras.forEach(l => {
            html += `<button class="btn-curso" onclick="seleccionarLetra(this, '${l}')">${l}</button>`;
        });
        document.getElementById("letrasContenedor").innerHTML = html;
    }

    function cargarBotonesCursos() {
        let html = "";
        for(let i=3; i<=11; i++) html += `<button class="btn-curso" onclick="seleccionarGrado(this, ${i})">${i}°</button>`;
        document.getElementById("gradosContenedor").innerHTML = html;
    }

    function resetearFormulario() {
        document.getElementById("textoVoz").value = "";
        document.getElementById("marcaBalon").value = "";
        document.querySelectorAll(".btn-objeto, .btn-curso").forEach(b => b.classList.remove("activo"));
        objetoActual = ""; gradoActual = ""; letraActual = "";
    }

    document.addEventListener("DOMContentLoaded", () => {
        cargarBotonesCursos();
        cargarDatos();
        setInterval(cargarDatos, 8000);
    });
</script>
{% endblock %}
