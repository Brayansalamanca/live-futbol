{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    .contenedor-registro {
        max-width: 95%;
        margin: 20px auto;
        padding: 20px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        backdrop-filter: blur(5px);
        color: white;
    }

    .btn-objeto, .btn-curso {
        padding: 10px 18px;
        margin: 5px;
        border: 2px solid transparent;
        border-radius: 10px;
        background: #ffffff;
        color: #0c0c0c;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .btn-objeto:hover, .btn-curso:hover {
        background: #5dade2;
        color: white;
        transform: translateY(-3px);
    }

    .btn-objeto.activo, .btn-curso.activo {
        background: #5f17e4;
        color: white;
        border-color: #ffffff;
        box-shadow: 0 0 15px rgba(95, 23, 228, 0.5);
    }

    #lugarSelect, #textoVoz, #buscador {
        width: 80%;
        max-width: 400px;
        padding: 12px;
        margin: 10px auto;
        border-radius: 10px;
        border: 2px solid #5dade2;
        font-size: 16px;
        outline: none;
        display: block;
        background-color: #ffffff;
        color: #333;
    }

    table {
        width: 100%;
        max-width: 1000px;
        border-radius: 15px;
        overflow: hidden;
        margin-top: 20px;
        background: white;
        color: black;
    }

    th { background-color: #2c3e50; color: white; padding: 15px; }
    td { padding: 12px; border-bottom: 1px solid #ddd; text-align: center; }

    .btn-entregado { background-color: #27ae60; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; margin: 2px; }
    .btn-editar { background-color: #2980b9; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; margin: 2px; }
</style>

<div class="contenedor-registro">
    <h1>⚽ Registro de Entrega (Balones y Equipos)</h1>

    <h3>1. Selecciona el objeto</h3>
    <div id="objetosContenedor" style="margin-bottom: 20px;">
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'balon futbol' )">⚽ Balón Fútbol</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'balon básquetbol')">🏀 Balón básquetbol</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'balon volley')">🏐 Balón Volley</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'cuerda')">🥨 Cuerda</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'ajedrez')">♟️ Ajedrez</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'jenga')">🧱 Jenga</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'ping pong')">🏓 Ping Pong</button>
    </div>

    <h3>2. Lugar de uso</h3>
    <select id="lugarSelect">
        <option>Cancha Sintética</option>
        <option>Cancha Externa</option>
        <option>Cancha de Baloncesto</option>
        <option>Cancha de Volley</option>
        <option>Sin lugar</option>
    </select>

    <h3>3. Nombre de la persona</h3>
    <input id="textoVoz" placeholder="Escribe el nombre del estudiante...">

    <div id="seccionCurso" style="margin: 20px 0; border: 1px solid rgba(255,255,255,0.3); padding: 15px; border-radius: 10px;">
        <h3>4. Selecciona el Curso</h3>
        <div id="gradosContenedor"></div>
        <div id="letrasContenedor" style="margin-top: 10px;"></div>
    </div>
    
    <button onclick="registrarEnNube()" style="background-color: #5f17e4; padding: 15px 40px; font-weight: bold; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px;">
        🚀 Registrar / Actualizar Entrega
    </button>

    <div class="seccion-busqueda">
        <h2>🔍 Buscar Registro en Tiempo Real</h2>
        <input id="buscador" placeholder="Buscar por nombre o curso..." onkeyup="dibujar()">
    </div>

    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>Nombre / Curso</th>
                    <th>Objeto</th>
                    <th>Lugar</th>
                    <th>Fecha / Hora</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla"></tbody>
        </table>
    </div>
</div>

<script>
    let registros = [];
    let objetoActual = "";
    let gradoActual = "";
    let letraActual = "";
    let editandoID = null;

    // 1. CARGA EN TIEMPO REAL (Mantenemos los 2 segundos, pero optimizado)
    async function cargarDatos() {
        try {
            const res = await fetch("{% url 'api_obtener_entregas' %}?t=" + new Date().getTime());
            const nuevosRegistros = await res.json();
            
            if (JSON.stringify(nuevosRegistros) !== JSON.stringify(registros)) {
                registros = nuevosRegistros;
                dibujar();
            }
        } catch (e) { 
            console.error("Error en la sincronización:", e); 
        }
    }

    setInterval(cargarDatos, 2000); 

    // 2. REGISTRO Y EDICIÓN (CORREGIDO PARA EVITAR CAÍDAS)
    async function registrarEnNube() {
        const nombreInput = document.getElementById("textoVoz").value.trim();
        const lugarInput = document.getElementById("lugarSelect").value;
        const cursoCompleto = gradoActual + (letraActual || "");

        if (!nombreInput || !objetoActual || !gradoActual) {
            alert("⚠️ Por favor completa: Nombre, Grado y Objeto");
            return;
        }

        // --- CAMBIO CLAVE: LÓGICA SECUENCIAL ---
        try {
            // Si hay un ID para editar, PRIMERO borramos y ESPERAMOS la respuesta
            if (editandoID) {
                console.log("Eliminando registro previo para actualizar...");
                const resEliminar = await fetch(`/api/eliminar-entrega/${editandoID}/`, {
                    method: "POST",
                    headers: { "X-CSRFToken": "{{ csrf_token }}" }
                });
                
                if (!resEliminar.ok) {
                    throw new Error("No se pudo eliminar el registro anterior");
                }
            }

            // Una vez confirmado el borrado (o si es nuevo), procedemos a guardar
            const datos = {
                recibido_por: nombreInput,
                curso: cursoCompleto,
                balon: objetoActual,
                lugar: lugarInput
            };

            const resGuardar = await fetch("{% url 'api_guardar_entrega' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify(datos)
            });

            if (resGuardar.ok) {
                console.log("¡Registro guardado con éxito!");
                resetearFormulario();
                await cargarDatos(); // Refrescar lista de inmediato
            } else {
                alert("❌ Error al guardar el nuevo registro.");
            }

        } catch (error) {
            console.error("Error en el proceso:", error);
            alert("⚠️ Ocurrió un error al procesar la edición. Intenta de nuevo.");
        }
    }

    function dibujar() {
        let html = "";
        const filtro = document.getElementById("buscador").value.toLowerCase();

        registros.forEach((r) => {
            const nombreMostrar = r.nombre || r.recibido_por || "Sin nombre";
            const objetoMostrar = r.objeto || r.balon || "Sin objeto";
            const cursoMostrar = r.curso || "N/A";
            const idReal = r._id || r.id;
            
            const info = (nombreMostrar + cursoMostrar).toLowerCase();
            
            if (info.includes(filtro)) {
                html += `
                <tr>
                    <td><strong>${nombreMostrar}</strong><br><small>${cursoMostrar}</small></td>
                    <td>${objetoMostrar}</td>
                    <td>${r.lugar || 'Cancha'}</td>
                    <td>${r.fecha ? new Date(r.fecha).toLocaleString() : 'Pendiente'}</td>
                    <td>
                        <button class="btn-editar" onclick="prepararEdicion('${idReal}', '${nombreMostrar}', '${objetoMostrar}', '${cursoMostrar}', '${r.lugar}')">Editar</button>
                        <button class="btn-entregado" onclick="marcarEntregado('${idReal}')">Finalizar</button>
                    </td>
                </tr>`;
            }
        });
        document.getElementById("tabla").innerHTML = html;
    }

    function prepararEdicion(id, nombre, objeto, curso, lugar) {
        editandoID = id;
        document.getElementById("textoVoz").value = nombre;
        document.getElementById("lugarSelect").value = lugar;
        
        objetoActual = objeto;
        document.querySelectorAll(".btn-objeto").forEach(b => {
            b.classList.toggle("activo", b.innerText.toLowerCase().includes(objeto.toLowerCase()));
        });

        // Extraer número y letra del curso
        const grado = parseInt(curso);
        const letra = curso.replace(grado, "");
        
        gradoActual = grado;
        letraActual = letra;

        cargarBotonesCursos();
        generarLetras(grado);

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetearFormulario() {
        document.getElementById("textoVoz").value = "";
        document.querySelectorAll(".btn-objeto, .btn-curso").forEach(b => b.classList.remove("activo"));
        objetoActual = ""; gradoActual = ""; letraActual = ""; editandoID = null;
        document.getElementById("letrasContenedor").innerHTML = "";
    }

    async function marcarEntregado(id) {
        if(confirm("¿El objeto fue devuelto correctamente?")) {
            const res = await fetch(`/api/eliminar-entrega/${id}/`, {
                method: "POST",
                headers: { "X-CSRFToken": "{{ csrf_token }}" }
            });
            if (res.ok) cargarDatos();
        }
    }

    function seleccionarObjeto(btn, obj) {
        objetoActual = obj;
        document.querySelectorAll(".btn-objeto").forEach(b => b.classList.remove("activo"));
        btn.classList.add("activo");
    }

    function seleccionarGrado(btn, grado) {
        gradoActual = grado;
        document.querySelectorAll("#gradosContenedor .btn-curso").forEach(b => b.classList.remove("activo"));
        btn.classList.add("activo");
        generarLetras(grado);
    }

    function seleccionarLetra(btn, letra) {
        letraActual = letra;
        document.querySelectorAll("#letrasContenedor .btn-curso").forEach(b => b.classList.remove("activo"));
        btn.classList.add("activo");
    }

    function generarLetras(grado) {
        let letras = ['A', 'B', 'C', 'D', 'E'];
        let limite = (grado === 9) ? 4 : (grado >= 10) ? 3 : 5;
        let html = "";
        for(let i=0; i<limite; i++) {
            const activa = (letraActual === letras[i]) ? "activo" : "";
            html += `<button class="btn-curso ${activa}" onclick="seleccionarLetra(this, '${letras[i]}')">${letras[i]}</button>`;
        }
        document.getElementById("letrasContenedor").innerHTML = html;
    }

    function cargarBotonesCursos() {
        let html = "";
        for(let i=3; i<=11; i++) {
            const activa = (gradoActual === i) ? "activo" : "";
            html += `<button class="btn-curso ${activa}" onclick="seleccionarGrado(this, ${i})">${i}°</button>`;
        }
        document.getElementById("gradosContenedor").innerHTML = html;
    }

    document.addEventListener("DOMContentLoaded", () => {
        cargarBotonesCursos();
        cargarDatos();
    });
</script>
{% endblock %}
