{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    /* Mantenemos tus estilos originales exactamente igual */
    .contenedor-registro {
        max-width: 95%;
        margin: 20px auto;
        padding: 20px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        backdrop-filter: blur(5px);
        color: white;
    }

    .btn-objeto, .btn-curso {
        padding: 10px 18px;
        margin: 5px;
        border: 2px solid transparent;
        border-radius: 10px;
        background: #ffffff;
        color: #0c0c0c;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .btn-objeto:hover, .btn-curso:hover {
        background: #5dade2;
        color: white;
        transform: translateY(-3px);
    }

    .btn-objeto.activo, .btn-curso.activo {
        background: #5f17e4;
        color: white;
        border-color: #ffffff;
        box-shadow: 0 0 15px rgba(95, 23, 228, 0.5);
    }

    #lugarSelect, #textoVoz, #buscador {
        width: 80%;
        max-width: 400px;
        padding: 12px;
        margin: 10px auto;
        border-radius: 10px;
        border: 2px solid #5dade2;
        font-size: 16px;
        outline: none;
        display: block;
        background-color: #ffffff;
        color: #333;
    }

    table {
        width: 100%;
        max-width: 1000px;
        border-radius: 15px;
        overflow: hidden;
        margin-top: 20px;
        background: white;
        color: black;
    }

    th { background-color: #2c3e50; color: white; padding: 15px; }
    td { padding: 12px; border-bottom: 1px solid #ddd; text-align: center; }

    .btn-entregado { background-color: #27ae60; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; }
</style>

<div class="contenedor-registro">
    <h1>⚽ Registro de Entrega (Balones y Equipos)</h1>

    <h3>1. Selecciona el objeto</h3>
    <div style="margin-bottom: 20px;">
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'balon futbol' )">⚽ Balón Fútbol</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'balon básquetbol')">🏀 Balón básquetbol</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'balon volley')">🏐 Balón Volley</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'cuerda')">🥨 Cuerda</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'ajedrez')">♟️ Ajedrez</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'jenga')">🧱 Jenga</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'ping pong')">🏓 Ping Pong</button>
    </div>

    <h3>2. Lugar de uso</h3>
    <select id="lugarSelect">
        <option>Cancha Sintética</option>
        <option>Cancha Externa</option>
        <option>Cancha de Baloncesto</option>
        <option>Cancha de Volley</option>
        <option>Sin lugar</option>
    </select>

    <h3>3. Nombre de la persona</h3>
    <input id="textoVoz" placeholder="Escribe el nombre del estudiante...">

    <div id="seccionCurso" style="margin: 20px 0; border: 1px solid rgba(255,255,255,0.3); padding: 15px; border-radius: 10px;">
        <h3>4. Selecciona el Curso</h3>
        <div id="gradosContenedor"></div>
        <div id="letrasContenedor" style="margin-top: 10px;"></div>
    </div>
    
    <button onclick="registrarEnNube()" style="background-color: #5f17e4; padding: 15px 40px; font-weight: bold; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px;">
        🚀 Registrar Entrega Global
    </button>

    <div class="seccion-busqueda">
        <h2>🔍 Buscar Registro en Tiempo Real</h2>
        <input id="buscador" placeholder="Buscar por nombre o curso..." onkeyup="dibujar()">
    </div>

    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>Nombre / Curso</th>
                    <th>Objeto</th>
                    <th>Lugar</th>
                    <th>Fecha / Hora</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla"></tbody>
        </table>
    </div>
</div>

<script>
    let registros = [];
    let objetoActual = "";
    let gradoActual = "";
    let letraActual = "";

    async function cargarDatos() {
        try {
            const res = await fetch("{% url 'api_obtener_entregas' %}");
            registros = await res.json();
            dibujar();
        } catch (e) { console.error("Error cargando datos:", e); }
    }

    async function registrarEnNube() {
        const nombreInput = document.getElementById("textoVoz").value.trim();
        const lugarInput = document.getElementById("lugarSelect").value;
        const cursoCompleto = gradoActual + (letraActual || "");

        if (!nombreInput || !objetoActual || !gradoActual) {
            alert("⚠️ Por favor completa: Nombre, Grado y Objeto");
            return;
        }

        // CORRECCIÓN: Los nombres de las llaves deben coincidir con tu views.py
        const datos = {
            recibido_por: nombreInput,
            curso: cursoCompleto,
            balon: objetoActual,
            lugar: lugarInput
        };

        const res = await fetch("{% url 'api_guardar_entrega' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify(datos)
        });

        if (res.ok) {
            alert("✅ Registro exitoso");
            document.getElementById("textoVoz").value = "";
            document.querySelectorAll(".btn-objeto, .btn-curso").forEach(b => b.classList.remove("activo"));
            objetoActual = ""; gradoActual = ""; letraActual = "";
            document.getElementById("letrasContenedor").innerHTML = "";
            cargarDatos();
        }
    }

    function dibujar() {
        let html = "";
        const filtro = document.getElementById("buscador").value.toLowerCase();

        registros.forEach((r) => {
            // EXPLICACIÓN: Intentamos leer 'nombre' (como está en la DB) 
            // o 'recibido_por' (por si acaso). Si ambos fallan, ponemos 'N/A'.
            const nombreMostrar = r.nombre || r.recibido_por || "Sin nombre";
            const objetoMostrar = r.objeto || r.balon || "Sin objeto";
            const cursoMostrar = r.curso || "N/A";
            
            const info = (nombreMostrar + cursoMostrar).toLowerCase();
            
            if (info.includes(filtro)) {
                html += `
                <tr>
                    <td><strong>${nombreMostrar}</strong><br><small>${cursoMostrar}</small></td>
                    <td>${objetoMostrar}</td>
                    <td>${r.lugar || 'Cancha'}</td>
                    <td>${r.fecha ? new Date(r.fecha).toLocaleString() : 'Recién guardado'}</td>
                    <td>
                        <button class="btn-entregado" onclick="marcarEntregado('${r._id || r.id}')">Finalizar</button>
                    </td>
                </tr>`;
            }
        });
        document.getElementById("tabla").innerHTML = html;
    }

    async function marcarEntregado(id) {
        if(confirm("¿El objeto fue devuelto correctamente?")) {
            const res = await fetch(`/api/eliminar-entrega/${id}/`, {
                method: "POST",
                headers: { "X-CSRFToken": "{{ csrf_token }}" }
            });
            if (res.ok) cargarDatos();
        }
    }

    function seleccionarObjeto(btn, obj) {
        objetoActual = obj;
        document.querySelectorAll(".btn-objeto").forEach(b => b.classList.remove("activo"));
        btn.classList.add("activo");
    }

    function seleccionarGrado(btn, grado) {
        gradoActual = grado;
        document.querySelectorAll("#gradosContenedor .btn-curso").forEach(b => b.classList.remove("activo"));
        btn.classList.add("activo");
        generarLetras(grado);
    }

    function seleccionarLetra(btn, letra) {
        letraActual = letra;
        document.querySelectorAll("#letrasContenedor .btn-curso").forEach(b => b.classList.remove("activo"));
        btn.classList.add("activo");
    }

    function generarLetras(grado) {
        let letras = ['A', 'B', 'C', 'D', 'E'];
        let limite = (grado === 9) ? 4 : (grado >= 10) ? 3 : 5;
        let html = "";
        for(let i=0; i<limite; i++) {
            html += `<button class="btn-curso" onclick="seleccionarLetra(this, '${letras[i]}')">${letras[i]}</button>`;
        }
        document.getElementById("letrasContenedor").innerHTML = html;
    }

    function cargarBotonesCursos() {
        let html = "";
        for(let i=3; i<=11; i++) {
            html += `<button class="btn-curso" onclick="seleccionarGrado(this, ${i})">${i}°</button>`;
        }
        document.getElementById("gradosContenedor").innerHTML = html;
    }

    document.addEventListener("DOMContentLoaded", () => {
        cargarBotonesCursos();
        cargarDatos();
    });
</script>
{% endblock %}
