{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    .contenedor-registro {
        max-width: 95%;
        margin: 20px auto;
        padding: 20px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        backdrop-filter: blur(5px);
        color: white;
        padding-top: 80px; /* Espacio para la navbar */
    }

    .btn-objeto, .btn-curso {
        padding: 10px 18px;
        margin: 5px;
        border: 2px solid transparent;
        border-radius: 10px;
        background: #ffffff;
        color: #0c0c0c;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .btn-objeto:hover, .btn-curso:hover {
        background: #5dade2;
        color: white;
        transform: translateY(-3px);
    }

    .btn-objeto.activo, .btn-curso.activo {
        background: #5f17e4;
        color: white;
        border-color: #ffffff;
        box-shadow: 0 0 15px rgba(95, 23, 228, 0.5);
    }

    #lugarSelect, #textoVoz, #buscador {
        width: 100%;
        max-width: 400px;
        padding: 12px;
        margin: 10px 0;
        border-radius: 10px;
        border: 2px solid #5dade2;
        font-size: 16px;
        outline: none;
        background-color: #ffffff;
        color: #333;
    }

    table {
        width: 100%;
        border-radius: 15px;
        overflow: hidden;
        margin-top: 20px;
        background: white;
        color: black;
        border-collapse: collapse;
    }

    th { background-color: #2c3e50; color: white; padding: 15px; }
    td { padding: 12px; border-bottom: 1px solid #ddd; text-align: center; }

    .btn-entregado { 
        background-color: #27ae60; 
        color: white; 
        border: none; 
        padding: 8px 15px; 
        border-radius: 5px; 
        cursor: pointer; 
        font-weight: bold; 
    }
</style>

<div class="contenedor-registro">
    <h1>⚽ Registro de Entrega (Balones y Equipos)</h1>

    <h3>1. Selecciona el objeto</h3>
    <div id="objetosContenedor" style="margin-bottom: 20px;">
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'Balón Fútbol')">⚽ Fútbol</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'Balón Básquet')">🏀 Básquet</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'Balón Volley')">🏐 Volley</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'Cuerda')">🥨 Cuerda</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'Ajedrez')">♟️ Ajedrez</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'Jenga')">🧱 Jenga</button>
        <button class="btn-objeto" onclick="seleccionarObjeto(this,'Ping Pong')">🏓 Ping Pong</button>
    </div>

    <h3>2. Lugar de uso</h3>
    <select id="lugarSelect">
        <option>Cancha Sintética</option>
        <option>Cancha Externa</option>
        <option>Cancha de Baloncesto</option>
        <option>Cancha de Volley</option>
        <option>Coliseo / Salón</option>
    </select>

    <h3>3. Nombre de la persona</h3>
    <input id="textoVoz" placeholder="Escribe el nombre del estudiante...">

    <div id="seccionCurso" style="margin: 20px 0; border: 1px solid rgba(255,255,255,0.3); padding: 15px; border-radius: 10px;">
        <h3>4. Selecciona el Curso</h3>
        <div id="gradosContenedor"></div>
        <div id="letrasContenedor" style="margin-top: 10px; min-height: 50px;"></div>
    </div>
    
    <button onclick="registrarEnNube()" style="background-color: #5f17e4; padding: 15px 40px; font-weight: bold; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; width: 100%; max-width: 400px;">
        🚀 Registrar Entrega
    </button>

    <hr style="margin: 40px 0; opacity: 0.2;">

    <div class="seccion-busqueda">
        <h2>🔍 Préstamos Activos</h2>
        <input id="buscador" placeholder="Buscar por nombre o curso..." onkeyup="dibujar()">
    </div>

    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>Nombre / Curso</th>
                    <th>Objeto</th>
                    <th>Lugar</th>
                    <th>Fecha / Hora</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla"></tbody>
        </table>
    </div>
</div>

<script>
    let registros = [];
    let objetoActual = "";
    let gradoActual = "";
    let letraActual = "";

    // --- LISTA DE VETADOS (Escribe los nombres aquí) ---
    const VETADOS = [
        "pepito perez",
        "fulano de tal"
    ];

    async function cargarDatos() {
        try {
            const res = await fetch("{% url 'api_obtener_entregas' %}");
            if (!res.ok) return;
            const nuevosRegistros = await res.json();
            if (nuevosRegistros.length !== registros.length) {
                registros = nuevosRegistros;
                dibujar();
            }
        } catch (e) { console.warn("Servidor ocupado..."); }
    }

    async function registrarEnNube() {
        const nombreInput = document.getElementById("textoVoz").value.trim();
        const lugarInput = document.getElementById("lugarSelect").value;
        const cursoCompleto = gradoActual + (letraActual || "");

        if (!nombreInput || !objetoActual || !gradoActual) {
            alert("⚠️ Completa: Nombre, Grado y Objeto");
            return;
        }

        // VALIDACIÓN DE VETADO
        if (VETADOS.includes(nombreInput.toLowerCase())) {
            alert("❌ ESTUDIANTE VETADO: No se permite el préstamo.");
            return;
        }

        const datos = {
            recibido_por: nombreInput,
            curso: cursoCompleto,
            balon: objetoActual,
            lugar: lugarInput
        };

        try {
            const res = await fetch("{% url 'api_guardar_entrega' %}", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}" },
                body: JSON.stringify(datos)
            });
            if (res.ok) {
                resetearFormulario();
                cargarDatos();
            }
        } catch (error) { alert("Error de conexión."); }
    }

    function dibujar() {
        let html = "";
        const filtro = document.getElementById("buscador").value.toLowerCase();
        registros.forEach((r) => {
            const nombre = r.nombre || r.recibido_por || "---";
            const objeto = r.objeto || r.balon || "---";
            const curso = r.curso || "N/A";
            if ((nombre + curso).toLowerCase().includes(filtro)) {
                html += `
                <tr>
                    <td><strong>${nombre}</strong><br><small>${curso}</small></td>
                    <td>${objeto}</td>
                    <td>${r.lugar || 'Cancha'}</td>
                    <td>${r.fecha ? new Date(r.fecha).toLocaleTimeString() : '---'}</td>
                    <td><button class="btn-entregado" onclick="marcarEntregado('${r.id}')">✅ Finalizar</button></td>
                </tr>`;
            }
        });
        document.getElementById("tabla").innerHTML = html || "<tr><td colspan='5'>No hay préstamos activos.</td></tr>";
    }

    async function marcarEntregado(id) {
        if(confirm("¿Confirmas la devolución?")) {
            const res = await fetch(`/api/eliminar-entrega/${id}/`, { method: "POST", headers: { "X-CSRFToken": "{{ csrf_token }}" } });
            if (res.ok) cargarDatos();
        }
    }

    function seleccionarObjeto(btn, obj) {
        objetoActual = obj;
        document.querySelectorAll(".btn-objeto").forEach(b => b.classList.remove("activo"));
        btn.classList.add("activo");
    }

    function seleccionarGrado(btn, grado) {
        gradoActual = grado;
        document.querySelectorAll("#gradosContenedor .btn-curso").forEach(b => b.classList.remove("activo"));
        btn.classList.add("activo");
        generarLetras(grado);
    }

    function seleccionarLetra(btn, letra) {
        letraActual = letra;
        document.querySelectorAll("#letrasContenedor .btn-curso").forEach(b => b.classList.remove("activo"));
        btn.classList.add("activo");
    }

    function generarLetras(grado) {
        let letras = ['A', 'B', 'C', 'D', 'E'];
        let limite = (grado >= 9) ? 4 : 5;
        let html = "";
        for(let i = 0; i < limite; i++) {
            html += `<button class="btn-curso" onclick="seleccionarLetra(this, '${letras[i]}')">${letras[i]}</button>`;
        }
        document.getElementById("letrasContenedor").innerHTML = html;
        letraActual = ""; 
    }

    function cargarBotonesCursos() {
        let html = "";
        for(let i=3; i<=11; i++) html += `<button class="btn-curso" onclick="seleccionarGrado(this, ${i})">${i}°</button>`;
        document.getElementById("gradosContenedor").innerHTML = html;
    }

    function resetearFormulario() {
        document.getElementById("textoVoz").value = "";
        document.querySelectorAll(".btn-objeto, .btn-curso").forEach(b => b.classList.remove("activo"));
        objetoActual = ""; gradoActual = ""; letraActual = "";
        document.getElementById("letrasContenedor").innerHTML = "";
    }

    document.addEventListener("DOMContentLoaded", () => {
        cargarBotonesCursos();
        cargarDatos();
        setInterval(cargarDatos, 8000); 
    });
</script>
{% endblock %}
