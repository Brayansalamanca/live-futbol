{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="padding-top: 110px; max-width: 1100px; margin: 0 auto; padding-left: 20px; padding-right: 20px; text-align: center;">

    <h1 style="background-color: #5f17e4; color: white; padding: 20px; border-radius: 15px; margin-bottom: 30px;">Inventario de Ropa</h1>

    <div style="background-color: #ffffff; padding: 30px; border-radius: 20px; color: #000; margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: left;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px;">
            
            <div>
                <label style="color: #333; font-weight: bold; display: block; margin-bottom: 8px;">Tipo de Objeto</label>
                <select id="objeto" style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #ddd; color: #000;">
                    <option value="">Seleccionar</option>
                    <option>Saco</option>
                    <option>Torero</option>
                    <option>Joger</option>
                    <option>Pantalón</option>
                    <option>Pantaloneta</option>
                    <option>Falda</option>
                    <option>Camiseta deportiva</option>
                    <option>Camiseta formal</option>
                </select>
            </div>

            <div>
                <label style="color: #333; font-weight: bold; display: block; margin-bottom: 8px;">Talla</label>
                <input id="talla" placeholder="Ej: M, L, 12..." style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #ddd; color: #000;">
            </div>

            <div>
                <label style="color: #333; font-weight: bold; display: block; margin-bottom: 8px;">Estado del Producto</label>
                <select id="estado_fisico" onchange="toggleDefecto()" style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #ddd; color: #000;">
                    <option value="Óptimo">Óptimas Condiciones</option>
                    <option value="Defecto">Con Defecto / Detalle</option>
                </select>
            </div>

            <div>
                <label style="color: #333; font-weight: bold; display: block; margin-bottom: 8px;">Subir Foto</label>
                <input type="file" id="imagen_file" style="width: 100%; color: #333;">
            </div>
        </div>

        <div id="campo_defecto" style="display: none; margin-bottom: 20px;">
            <label style="color: #333; font-weight: bold; display: block; margin-bottom: 8px;">Especifique el Defecto</label>
            <textarea id="descripcion_defecto" placeholder="Ej: Mancha pequeña, roto en costura..." style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #e74c3c; color: #000; min-height: 60px;"></textarea>
        </div>

        <button onclick="agregar()" style="background-color: #28a745; color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px;">
            REGISTRAR PRODUCTO
        </button>
    </div>

    <input id="busqueda" placeholder="🔍 Buscar por nombre, talla o detalle..." onkeyup="dibujar()" 
           style="width: 100%; padding: 15px; border-radius: 15px; border: none; font-size: 16px; color: #000; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">

    <h2 style="background-color: #28a745; color: white; padding: 12px; border-radius: 10px; margin-bottom: 15px;">🟢 DISPONIBLES</h2>
    <div style="overflow-x: auto; background: white; border-radius: 15px; margin-bottom: 40px;">
        <table style="width: 100%; border-collapse: collapse; color: #333;">
            <thead style="background-color: #2c3e50; color: white;">
                <tr>
                    <th style="padding: 15px;">Foto</th>
                    <th>Objeto</th>
                    <th>Talla</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaDisponibles"></tbody>
        </table>
    </div>

    <h2 style="background-color: #e74c3c; color: white; padding: 12px; border-radius: 10px; margin-bottom: 15px;">🔴 APARTADOS</h2>
    <div style="overflow-x: auto; background: white; border-radius: 15px;">
        <table style="width: 100%; border-collapse: collapse; color: #333;">
            <thead style="background-color: #2c3e50; color: white;">
                <tr>
                    <th style="padding: 15px;">Foto</th>
                    <th>Objeto</th>
                    <th>Talla</th>
                    <th>Apartado por / Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaApartados"></tbody>
        </table>
    </div>
</div>

<div id="visor_inv" onclick="cerrarVisor()" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 99999; justify-content: center; align-items: center;">
    <img id="img_visor_inv" onclick="zoomClick(event)" style="max-width: 90%; max-height: 90%; border: 3px solid white; border-radius: 5px; transition: 0.3s; cursor: zoom-in;">
</div>

<style>
    /* ID y Clase específica para que la imagen sea GRANDE y no circular */
    .img-producto-inventario { 
        width: 120px !important; 
        height: 120px !important; 
        border-radius: 10px !important; 
        object-fit: cover !important; 
        margin: 10px auto !important;
        border: 3px solid #5f17e4 !important;
        display: block !important;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2) !important;
    }
    td { padding: 10px !important; border-bottom: 1px solid #eee !important; text-align: center !important; vertical-align: middle !important; }
    button { padding: 8px 12px; border-radius: 6px; border: none; color: white; cursor: pointer; font-weight: bold; margin: 2px; }
</style>

<script>
let inventario = JSON.parse(localStorage.getItem("inventario")) || [];
let zoomNivel = 1;
let editandoIndex = null;

function guardar() { localStorage.setItem("inventario", JSON.stringify(inventario)); }

function toggleDefecto() {
    const estado = document.getElementById("estado_fisico").value;
    document.getElementById("campo_defecto").style.display = (estado === "Defecto") ? "block" : "none";
}

function agregar() {
    const objeto = document.getElementById("objeto").value;
    const talla = document.getElementById("talla").value.trim();
    const estado_fisico = document.getElementById("estado_fisico").value;
    const defecto = document.getElementById("descripcion_defecto").value;
    const file = document.getElementById("imagen_file").files[0];

    if (!objeto || !talla || !file) { alert("Faltan datos"); return; }

    const reader = new FileReader();
    reader.onload = e => {
        inventario.push({
            objeto, talla, estado: "Disponible", nombre: "", 
            imagen: e.target.result, 
            condicion: estado_fisico, 
            detalle_defecto: estado_fisico === "Defecto" ? defecto : ""
        });
        guardar(); dibujar();
        document.getElementById("talla").value = "";
        document.getElementById("imagen_file").value = "";
    }
    reader.readAsDataURL(file);
}

function dibujar() {
    let disp = "", apart = "";
    let filtro = document.getElementById("busqueda").value.toLowerCase();

    inventario.forEach((p, i) => {
        if (!p.objeto.toLowerCase().includes(filtro) && !p.talla.toLowerCase().includes(filtro)) return;

        let contenido = (editandoIndex === i) ? filaEdicion(p, i) : filaNormal(p, i);
        
        if (p.estado === "Disponible") disp += contenido;
        else apart += contenido;
    });

    document.getElementById("tablaDisponibles").innerHTML = disp;
    document.getElementById("tablaApartados").innerHTML = apart;
}

function filaNormal(p, i) {
    const esApartado = p.estado !== "Disponible";
    return `
    <tr>
        <td><img id="img_inv_${i}" class="img-producto-inventario" src="${p.imagen}" onclick="verImagen('${p.imagen}')"></td>
        <td style="font-weight:bold;">${p.objeto}</td>
        <td>${p.talla}</td>
        <td>
            <b style="color:${p.condicion === 'Óptimo' ? '#28a745' : '#e74c3c'}">${p.condicion}</b>
            ${esApartado ? `<br><small>Por: ${p.nombre}</small>` : ""}
            ${p.detalle_defecto ? `<br><small>${p.detalle_defecto}</small>` : ""}
        </td>
        <td>
            ${!esApartado ? `<button onclick="apartar(${i})" style="background:#5f17e4;">Apartar</button>` : `<button onclick="liberar(${i})" style="background:#28a745;">Liberar</button>`}
            <button onclick="editar(${i})" style="background:#ffc107; color:black;">Editar</button>
            <button onclick="eliminar(${i})" style="background:#e74c3c;">X</button>
        </td>
    </tr>`;
}

function filaEdicion(p, i) {
    return `
    <tr>
        <td><input type="file" id="editFile${i}" style="width:90px; font-size:10px;"></td>
        <td><input id="editObj${i}" value="${p.objeto}" style="width:80px; color:black;"></td>
        <td><input id="editTalla${i}" value="${p.talla}" style="width:40px; color:black;"></td>
        <td>
            <select id="editCond${i}" style="color:black;">
                <option value="Óptimo" ${p.condicion==='Óptimo'?'selected':''}>Óptimo</option>
                <option value="Defecto" ${p.condicion==='Defecto'?'selected':''}>Defecto</option>
            </select>
            <input id="editDetalle${i}" value="${p.detalle_defecto}" placeholder="Defecto..." style="width:80px; color:black; display:block; margin:2px auto;">
            ${p.estado==='Apartado' ? `<input id="editNombre${i}" value="${p.nombre}" style="width:80px; color:black;" placeholder="Nombre">` : ''}
        </td>
        <td>
            <button onclick="guardarEdicion(${i})" style="background:#28a745;">✔</button>
            <button onclick="cancelarEdicion()" style="background:#777;">✖</button>
        </td>
    </tr>`;
}

function editar(i) { editandoIndex = i; dibujar(); }
function cancelarEdicion() { editandoIndex = null; dibujar(); }

function guardarEdicion(i) {
    inventario[i].objeto = document.getElementById("editObj"+i).value;
    inventario[i].talla = document.getElementById("editTalla"+i).value;
    inventario[i].condicion = document.getElementById("editCond"+i).value;
    inventario[i].detalle_defecto = document.getElementById("editDetalle"+i).value;
    if(inventario[i].estado === 'Apartado') {
        inventario[i].nombre = document.getElementById("editNombre"+i).value;
    }

    const nuevaImg = document.getElementById("editFile"+i).files[0];
    if (nuevaImg) {
        const reader = new FileReader();
        reader.onload = e => {
            inventario[i].imagen = e.target.result;
            editandoIndex = null; guardar(); dibujar();
        }
        reader.readAsDataURL(nuevaImg);
    } else {
        editandoIndex = null; guardar(); dibujar();
    }
}

function apartar(i) {
    let n = prompt("Nombre:");
    if(n) { inventario[i].estado="Apartado"; inventario[i].nombre=n; guardar(); dibujar(); }
}
function liberar(i) { inventario[i].estado="Disponible"; inventario[i].nombre=""; guardar(); dibujar(); }
function eliminar(i) { if(confirm("¿Eliminar?")) { inventario.splice(i,1); guardar(); dibujar(); } }

function verImagen(s) {
    const v = document.getElementById("visor_inv");
    const img = document.getElementById("img_visor_inv");
    img.src = s; zoomNivel = 1; img.style.transform = "scale(1)"; v.style.display = "flex";
}
function cerrarVisor() { document.getElementById("visor_inv").style.display = "none"; }
function zoomClick(e) { e.stopPropagation(); zoomNivel = zoomNivel === 1 ? 2 : 1; document.getElementById("img_visor_inv").style.transform = `scale(${zoomNivel})`; }

dibujar();
</script>
{% endblock %}
