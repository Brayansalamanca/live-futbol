{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="padding-top: 110px; max-width: 1100px; margin: 0 auto; padding-left: 20px; padding-right: 20px; text-align: center;">

    <h1 style="background-color: #e67e22; color: white; padding: 20px; border-radius: 15px; margin-bottom: 30px;">🔍 Radar de Objetos Perdidos</h1>

    <div style="background-color: #ffffff; padding: 30px; border-radius: 20px; color: #000; margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: left;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px;">
            
            <div>
                <label style="color: #333; font-weight: bold; display: block; margin-bottom: 8px;">¿Quién lo encontró?</label>
                <input id="nombre_reporta" placeholder="Nombre completo..." style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #ddd; color: #000;">
            </div>

            <div>
                <label style="color: #333; font-weight: bold; display: block; margin-bottom: 8px;">Curso</label>
                <input id="curso_reporta" placeholder="Ej: 10A, 11B..." style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #ddd; color: #000;">
            </div>

            <div>
                <label style="color: #333; font-weight: bold; display: block; margin-bottom: 8px;">Tipo de Objeto</label>
                <select id="tipo_objeto" style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #ddd; color: #000;">
                    <option value="">Seleccionar</option>
                    <option>Cartuchera</option>
                    <option>Chaqueta / Saco</option>
                    <option>Termo / Botella</option>
                    <option>Cuaderno / Libro</option>
                    <option>Gafas</option>
                    <option>Llaves</option>
                    <option>Celular</option>
                    <option>Otro</option>
                </select>
            </div>

            <div>
                <label style="color: #333; font-weight: bold; display: block; margin-bottom: 8px;">Subir Foto (Evidencia)</label>
                <input type="file" id="imagen_file" style="width: 100%; color: #333;">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 20px;">
            <div>
                <label style="color: #333; font-weight: bold; display: block; margin-bottom: 8px;">Color Predominante</label>
                <input id="color_objeto" placeholder="Ej: Azul con negro..." style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #ddd; color: #000;">
            </div>
            <div>
                <label style="color: #333; font-weight: bold; display: block; margin-bottom: 8px;">Descripción o Seña Particular</label>
                <textarea id="descripcion_dif" placeholder="Ej: Tiene un sticker de Batman, le falta un botón..." style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #ddd; color: #000; min-height: 60px;"></textarea>
            </div>
        </div>

        <button onclick="registrarObjeto()" style="background-color: #e67e22; color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px;">
            🚀 PUBLICAR OBJETO ENCONTRADO
        </button>
    </div>

    <input id="busqueda" placeholder="🔍 Buscar por objeto, color o descripción..." onkeyup="dibujar()" 
           style="width: 100%; padding: 15px; border-radius: 15px; border: none; font-size: 16px; color: #000; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">

    <h2 style="background-color: #2c3e50; color: white; padding: 12px; border-radius: 10px; margin-bottom: 15px;">📦 Galería de Objetos Encontrados</h2>
    <div style="overflow-x: auto; background: white; border-radius: 15px; margin-bottom: 40px;">
        <table style="width: 100%; border-collapse: collapse; color: #333;">
            <thead style="background-color: #2c3e50; color: white;">
                <tr>
                    <th style="padding: 15px;">Foto</th>
                    <th>Información</th>
                    <th>Color / Detalle</th>
                    <th>Reportado por</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaObjetos"></tbody>
        </table>
    </div>
</div>

<div id="visor_lost" onclick="cerrarVisor()" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 99999; justify-content: center; align-items: center;">
    <img id="img_visor_lost" style="max-width: 90%; max-height: 90%; border: 3px solid white; border-radius: 5px;">
</div>

<style>
    .img-lost { 
        width: 100px; height: 100px; object-fit: cover; border-radius: 10px; 
        border: 2px solid #e67e22; cursor: pointer; transition: 0.3s;
    }
    .img-lost:hover { transform: scale(1.05); }
    td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; vertical-align: middle; }
    .btn-borrar { background: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
</style>

<script>
let objetosGlobal = [];

// CARGAR DATOS CON POLLING LENTO (8 segundos para no saturar)
async function cargarObjetos() {
    try {
        const res = await fetch("{% url 'api_obtener_objetos' %}");
        const data = await res.json();
        
        // Solo redibuja si hay cambios en la cantidad
        if (data.length !== objetosGlobal.length) {
            objetosGlobal = data;
            dibujar();
        }
    } catch (e) { console.error("Error al cargar:", e); }
}

async function registrarObjeto() {
    const nombre = document.getElementById("nombre_reporta").value.trim();
    const curso = document.getElementById("curso_reporta").value.trim();
    const tipo = document.getElementById("tipo_objeto").value;
    const color = document.getElementById("color_objeto").value.trim();
    const dif = document.getElementById("descripcion_dif").value.trim();
    const file = document.getElementById("imagen_file").files[0];

    if (!nombre || !tipo || !file) { 
        alert("⚠️ Por favor completa el nombre, el tipo de objeto y sube una foto."); 
        return; 
    }

    const reader = new FileReader();
    reader.onload = async e => {
        const datos = {
            nombre: nombre,
            curso: curso,
            tipo: tipo,
            color: color,
            dif: dif,
            foto: e.target.result // Se envía como Base64
        };

        const res = await fetch("{% url 'api_guardar_objeto' %}", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}" },
            body: JSON.stringify(datos)
        });

        if (res.ok) {
            alert("✅ Objeto reportado con éxito.");
            location.reload();
        }
    };
    reader.readAsDataURL(file);
}

function dibujar() {
    let html = "";
    let filtro = document.getElementById("busqueda").value.toLowerCase();

    objetosGlobal.forEach((obj) => {
        // Buscador inteligente
        const contenidoBusqueda = (obj.tipo_objeto + obj.color + obj.descripcion).toLowerCase();
        if (!contenidoBusqueda.includes(filtro)) return;

        html += `
        <tr>
            <td><img class="img-lost" src="${obj.foto || ''}" onclick="verImagen('${obj.foto}')"></td>
            <td><b style="font-size:1.1em; color:#d35400;">${obj.tipo_objeto}</b><br><small>${obj.fecha ? new Date(obj.fecha).toLocaleDateString() : ''}</small></td>
            <td><b>Color:</b> ${obj.color}<br><small>${obj.descripcion}</small></td>
            <td><b>${obj.nombre_reporta}</b><br>Curso: ${obj.curso || 'N/A'}</td>
            <td>
                <button class="btn-borrar" onclick="eliminarObjeto('${obj.id}')">Eliminar</button>
            </td>
        </tr>`;
    });

    document.getElementById("tablaObjetos").innerHTML = html || "<tr><td colspan='5'>No se han encontrado objetos con ese criterio.</td></tr>";
}

async function eliminarObjeto(id) {
    if(confirm("¿Este objeto ya fue devuelto a su dueño?")) {
        const res = await fetch(`/api/eliminar-objeto/${id}/`, {
            method: "POST",
            headers: { "X-CSRFToken": "{{ csrf_token }}" }
        });
        if(res.ok) cargarObjetos();
    }
}

// VISOR
function verImagen(s) {
    const v = document.getElementById("visor_lost");
    const img = document.getElementById("img_visor_lost");
    img.src = s; v.style.display = "flex";
}
function cerrarVisor() { document.getElementById("visor_lost").style.display = "none"; }

document.addEventListener("DOMContentLoaded", () => {
    cargarObjetos();
    setInterval(cargarObjetos, 8000); // Polling cada 8 segundos
});
</script>
{% endblock %}
