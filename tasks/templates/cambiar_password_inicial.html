{% extends 'base.html' %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/cambiar_password_inicial.css' %}">

<div class="password-container">

    <div class="password-card">

        <div class="password-icon">

            🔐

        </div>

        <h2 class="password-title">

            Cambiar contraseña

        </h2>

        <p class="password-subtitle">

            Por seguridad debes crear una nueva contraseña
            para continuar usando la plataforma.

        </p>

        {% if error %}

            <div class="password-error">

                {{ error }}

            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input
                type="password"
                name="password1"
                placeholder="Nueva contraseña"
                required
                class="password-input"
            >

            <input
                type="password"
                name="password2"
                placeholder="Confirmar contraseña"
                required
                class="password-input"
            >

            <button
                type="submit"
                class="password-btn"
            >

                Guardar contraseña

            </button>

        </form>

    </div>

</div>

{% endblock %}
