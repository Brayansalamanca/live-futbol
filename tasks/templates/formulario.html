{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="contenedor-registro-prenda">
    <div class="card card-registro-premium">
        <div class="header-registro">
            <div class="icono-flotante">📦</div>
            <h2>Registrar Nueva Prenda</h2>
            <p>Añade nuevos artículos al inventario oficial de Live Futbol</p>
        </div>
        
        <form id="formInventario" class="form-moderno">
            {% csrf_token %}
            
            <div class="grupo-input">
                <label for="nombre">Nombre de la Prenda</label>
                <input type="text" id="nombre" class="input-hibrido-grande" placeholder="Ej: Camiseta Titular 2026">
            </div>

            <div class="fila-doble">
                <div class="grupo-input">
                    <label for="cantidad">Cantidad Inicial</label>
                    <input type="number" id="cantidad" class="input-hibrido-grande" value="1" min="1">
                </div>
                
                <div class="grupo-input">
                    <label for="talla">Talla</label>
                    <select id="talla" class="input-hibrido-grande select-custom">
                        <option value="">Seleccionar...</option>
                        <optgroup label="Infantil">
                            <option value="6">6</option><option value="8">8</option><option value="10">10</option><option value="12">12</option><option value="14">14</option>
                        </optgroup>
                        <optgroup label="Adulto">
                            <option value="XS">XS</option><option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <div class="grupo-input">
                <label>Foto de la Prenda</label>
                <div class="upload-container" onclick="document.getElementById('imagenInput').click()">
                    <input type="file" id="imagenInput" accept="image/*" hidden onchange="previsualizar(this)">
                    <div id="preview-placeholder">
                        <span class="upload-icon">📸</span>
                        <p>Haz clic para subir o arrastra una imagen</p>
                    </div>
                    <img id="preview-img" src="" style="display: none;" class="img-preview-fija">
                </div>
            </div>

            <button type="button" id="btnGuardar" class="btn-principal-grande">
                <span>🚀 SUBIR AL CATÁLOGO</span>
            </button>
        </form>
    </div>
</div>

<link rel="stylesheet" href="{% static 'css/formulario.css' %}">
<script language="javascript" src="{% static 'js/formulario.js' %}"></script>
    
{% endblock %}
