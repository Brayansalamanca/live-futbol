{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    .contenedor-registro {
        max-width: 600px;
        margin: 80px auto;
        padding: 30px;
        background: rgba(0, 13, 26, 0.9);
        border: 2px solid #0059b3;
        border-radius: 20px;
        color: white;
        box-shadow: 0 0 30px rgba(0, 89, 179, 0.3);
    }
    .input-futbol {
        width: 100%; padding: 12px; margin: 10px 0;
        background: #001a33; border: 1px solid #00ccff;
        color: white; border-radius: 10px;
    }
    .btn-registrar {
        width: 100%; background: #5f17e4; color: white;
        padding: 15px; border: none; border-radius: 10px;
        font-weight: bold; cursor: pointer; font-size: 16px;
    }
</style>

<div class="contenedor-registro">
    <h1 style="color: #00ccff; text-align: center;">📦 Registro de Inventario</h1>
    <form onsubmit="event.preventDefault(); guardarInventario(this);">
        {% csrf_token %}
        <h3>1. Datos de la Prenda</h3>
        <input type="text" name="nombre" class="input-futbol" placeholder="Nombre de la prenda (Ej: Uniforme Titular)" required>
        
        <label>Cantidad Disponible:</label>
        <input type="number" name="cantidad" class="input-futbol" value="1" min="1" required>

        <h3>2. Imagen de Referencia</h3>
        <input type="file" name="imagen" class="input-futbol" accept="image/*" required>

        <button type="submit" class="btn-registrar">🚀 SUBIR AL CATÁLOGO</button>
    </form>
</div>

<script>
async function guardarInventario(form) {
    const formData = new FormData(form);
    try {
        const res = await fetch("{% url 'api_guardar_prenda' %}", {
            method: "POST",
            body: formData,
            headers: { "X-CSRFToken": "{{ csrf_token }}" }
        });
        if (res.ok) {
            alert("✅ Prenda subida con éxito al catálogo.");
            window.location.href = "{% url 'tipos' %}";
        }
    } catch (e) { alert("Error al conectar."); }
}
</script>
{% endblock %}
