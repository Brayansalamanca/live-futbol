{% extends 'base.html' %}
{% block content %}
<div style="background-color: #000d1a; min-height: 100vh; padding: 40px; color: white;">
    <div style="max-width: 800px; margin: 0 auto; background: rgba(255, 255, 255, 0.05); border: 1px solid #ff007f; padding: 30px; border-radius: 20px;">
        <h2 style="color: #ff007f; text-align: center; text-transform: uppercase;">🆕 Registrar Nueva Prenda en Inventario</h2>
        <p style="text-align: center; color: #88a0b0; font-size: 14px;">Espacio exclusivo para administración (Rosita)</p>
        <hr style="border: 0.5px solid rgba(255,0,127,0.2); margin: 20px 0;">

        <form action="/api/guardar-prenda/" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                    <label style="color: #00ccff; display: block; margin-bottom: 5px;">Nombre de la Prenda</label>
                    <input type="text" name="nombre" placeholder="Ej: Uniforme Titular 2026" required style="width: 100%; background: #001a33; border: 1px solid #0059b3; color: white; padding: 10px; border-radius: 8px;">
                </div>
                <div>
                    <label style="color: #00ccff; display: block; margin-bottom: 5px;">Categoría</label>
                    <select name="categoria" style="width: 100%; background: #001a33; border: 1px solid #0059b3; color: white; padding: 10px; border-radius: 8px;">
                        <option>Uniformes de Juego</option>
                        <option>Petos Entrenamiento</option>
                        <option>Implementos Portero</option>
                    </select>
                </div>
            </div>

            <div style="margin-top: 20px;">
                <label style="color: #00ccff; display: block; margin-bottom: 5px;">Imagen de la Prenda (Para el catálogo)</label>
                <input type="file" name="imagen" accept="image/*" required style="width: 100%; color: #88a0b0;">
            </div>

            <button type="submit" style="width: 100%; margin-top: 30px; background: #ff007f; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer;">
                ✅ GUARDAR EN CATÁLOGO
            </button>
        </form>
    </div>
</div>
{% endblock %}
