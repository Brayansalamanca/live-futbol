{% extends "base.html" %}
{% block content %}

<style>
:root {
    --verde: #22c55e;
    --rojo: #ef4444;
    --amarillo: #facc15;
    --azul: #38bdf8;
    --dark: #020617;
}

body {
    background: var(--dark);
    color: white;
}

/* 🔍 PANEL */
.panel {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    background: rgba(255,255,255,0.05);
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.full { grid-column: 1 / -1; }

input, select, button {
    padding: 8px;
    border-radius: 6px;
    border: none;
}

input, select {
    background: #1e293b;
    color: white;
}

/* 📑 TABS */
.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.tabs button {
    background: #1e293b;
    color: white;
    cursor: pointer;
}

/* 📦 ACORDEÓN */
.row {
    background: #1e293b;
    margin-top: 10px;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    border-left: 4px solid var(--azul);
}

.detalle {
    display: none;
    background: rgba(255,255,255,0.03);
    padding: 10px;
    border-radius: 0 0 8px 8px;
}

/* 📊 TABLA */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

th {
    color: var(--azul);
    padding: 6px;
}

td {
    padding: 5px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

/* ESTADOS */
.ok { background: var(--verde); }
.falta { background: var(--rojo); }
.extra { background: var(--amarillo); }
</style>

<h2>Radar de Alimentación</h2>

<!-- 🔍 PANEL SUPERIOR -->
<div class="panel">
    <input type="text" id="nombre" placeholder="Nombre">
    <input type="text" id="grado" placeholder="Grado">

    <select id="seccion">
        <option value="">Sección</option>
        <option value="masters">Masters</option>
        <option value="seniors">Seniors</option>
        <option value="teens">Teens</option>
    </select>

    <button onclick="buscar()">Buscar</button>
    <div class="full">Solo necesitas un campo para buscar</div>
</div>

<!-- 📑 TABS -->
<div class="tabs">
    <button onclick="cambiarTab('grave')">Grave</button>
    <button onclick="cambiarTab('extra')">Extra</button>
    <button onclick="cambiarTab('normal')">Normal</button>
    <button onclick="cambiarTab('nopagan')">No pagan</button>
</div>

<!-- 📊 CONTENIDO -->
<div id="grave" class="tab"></div>
<div id="extra" class="tab" style="display:none;"></div>
<div id="normal" class="tab" style="display:none;"></div>
<div id="nopagan" class="tab" style="display:none;"></div>

<script>

// 🔁 CAMBIO DE TAB
function cambiarTab(tab){
    document.querySelectorAll(".tab").forEach(t => t.style.display="none");
    document.getElementById(tab).style.display="block";
}

// 🔽 ACORDEÓN
function toggle(id){
    const el = document.getElementById(id);
    el.style.display = el.style.display === "block" ? "none" : "block";
}

// 🔍 BUSCAR
function buscar(){
    console.log("Buscar...");
}

// 🧠 CREAR TABLA INTERNA
function crearTabla(personas, dias){
    return `
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Grado</th>
                ${dias.map(d => `<th>${d}</th>`).join("")}
            </tr>
        </thead>
        <tbody>
            ${personas.map(p => `
                <tr>
                    <td>${p.nombre}</td>
                    <td>${p.grado}</td>
                    ${dias.map(d => {
                        let val = p.asistencia[d] || "";
                        let cls = val === "ok" ? "ok" : val === "falta" ? "falta" : val === "extra" ? "extra" : "";
                        return `<td class="${cls}">${val}</td>`;
                    }).join("")}
                </tr>
            `).join("")}
        </tbody>
    </table>`;
}

// 🚀 RENDER PRINCIPAL (TIPO EQUIPO / GRUPO)
function renderTab(id, data){
    const cont = document.getElementById(id);
    cont.innerHTML = "";

    data.forEach((grupo, i) => {
        cont.innerHTML += `
            <div class="row" onclick="toggle('det-${id}-${i}')">
                <span><b>${grupo.nombre}</b></span>
                <span>⬇️</span>
            </div>

            <div id="det-${id}-${i}" class="detalle">
                ${crearTabla(grupo.personas, grupo.dias)}
            </div>
        `;
    });
}

// 🧪 EJEMPLO (SIMULA TU BACKEND)
function cargarEjemplo(){
    const dias = [10,11,12,13];

    const data = [
        {
            nombre: "Grado 9A",
            dias: dias,
            personas: [
                {nombre:"Juan", grado:"9A", asistencia:{10:"ok",11:"falta"}},
                {nombre:"Ana", grado:"9A", asistencia:{10:"extra",11:"ok"}}
            ]
        }
    ];

    renderTab("grave", data);
    renderTab("extra", data);
    renderTab("normal", data);
    renderTab("nopagan", data);
}

// 🔥 CUANDO CONECTES DJANGO
function cargarDatos(){
    fetch("/api/asistencia/")
    .then(res => res.json())
    .then(data => {
        renderTab("grave", data.grave);
        renderTab("extra", data.extra);
        renderTab("normal", data.normal);
        renderTab("nopagan", data.nopagan);
    });
}

cargarEjemplo();
// cargarDatos();

</script>

{% endblock %}
